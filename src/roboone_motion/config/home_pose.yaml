# ホームポジション（立位・歩行の基準姿勢）。2026-08-28 定義。
#
# ===========================================================================
# 足裏の位置姿勢で定義する。関節角は IK が決める。
# ===========================================================================
# 狙いは「胴体が直立・足裏が水平・骨盤が所定の高さ」であって、そこに至る関節角は
# IK が出せばよい。以前は関節角（股ピッチ -20 / 膝 40 / 足首 -20）で書いていたが、
# やめた。理由は 3 つ:
#
#   * 「大腿と下腿を同じだけ傾ける」＝「膝 = 2 x 股ピッチ」という手計算の関係を
#     人間が保守することになる。脚の寸法が変わればこの関係も崩れる
#   * 関節角には AXIS_FLIP（サーボの回転方向）が絡み、**左右で同じ数値が同じ姿勢に
#     ならない**。足裏の位置姿勢なら左右の鏡像は y の符号を変えるだけで済む
#   * モーション（roboone_motion_node/config/motions.yaml）も足裏の (p, R) で書く。
#     同じ土俵に乗るので、ティーチした姿勢をそのままホームにもできる
#
# 「脚を何度曲げるか」は結果であって指定値ではない。height を決めれば IK が決める。
#
# 単位: 位置 mm / 角度 deg。座標系 Σ_B（x 前・y 左・z 上、原点 = 骨盤 = 股 3 軸の高さ）

foot:
  # [mm] 骨盤から足裏まで。**この値がそのまま LIPM の z_c になる。**
  # gait.yaml の z_c（m 単位）と一致させること。合っていないと motion が起動時に警告する。
  #
  # 伸び切りは 299.945 mm（leg_config.hpp の L3+L4+L5+L6）。低くするほど脚を曲げるので
  #   * 足首ピッチ θ6 を食う（平屈伸なら θ6 ≒ -(脚の傾き)）
  #   * 膝のトルクと発熱が増える
  # 逆に高くしすぎると膝が伸び切って IK の特異点に近づく。
  #
  # 参考（脚の傾き -> 高さ）: 30 deg -> 260.9 / 20 deg -> 282.4 / 15 deg -> 290.0
  #
  # 261 = 脚の傾き 30 deg 相当。重心を下げるため 282 から戻した（2026-08-28）。
  # このとき（x -20 / pitch -10 込みで）股ピッチ -25.4 / 膝の曲げ 59.1 /
  # 足首 θ6 -43.7 deg。θ6 の下限はロール 0 で -54.8 なので余裕 11.1 deg。
  # ★歩行で指令する足裏はロール 0 固定（rpy の roll が 0 なので θ5 = 0）なので、
  #   歩く分にはこの余裕で足りる。手で脚をひねってロールを入れると
  #   （ロール 15 deg で下限 -34.5）足りなくなる。
  height: 261.0

  # [mm] 前後。+ が前（足裏が骨盤より前に出る）。
  # ★後傾するときはここを **負** にする（足より骨盤を前に出す = 重心が前へ寄る）。
  #   前傾するなら正。実機を見ながら数 mm ずつ動かす調整代。
  #
  # -20 にしてあるのは応急処置。膝（4 節リンク）の剛性が足りず、荷重で「しなって」
  # 実際の曲げ量が指令より深くなるため、そのぶん後傾する。2026-08-28 実機で確認。
  # **本来はリンクの剛性を上げて消すべきずれ**で、ここは対症療法。
  x: -20.0

  # [mm] 左右の半間隔。leg_config.hpp の HIP_Y（89.3）と同じなら足は股の真下に来る。
  # gait.yaml の foot_spacing（= 2 x この値 / 1000）と揃えること。
  y: 89.3

  # [deg] 足裏の姿勢 (roll, pitch, yaw)。0, 0, 0 が水平。
  # 左右には鏡像で入る（roll と yaw は符号が反転し、pitch は左右同じ）。
  #
  # **この姿勢は歩行中もそのまま使われる**（walk_core は平行移動しか作らないので、
  # 遊脚・支持脚とも足裏の向きはここで決まる）。立位と歩行で別々に持たない。
  #
  # pitch の符号（2026-08-28 に IK と FK で確認した実測値）:
  #   pitch -10 -> つま先が 10.4mm 上がる -> 脛が前へ倒れる -> **胴体は前へ**
  #   pitch +10 -> つま先が 10.4mm 下がる -> 脛が後ろへ     -> 胴体は後ろへ
  #
  # ★いまは 0（バッファなし）。
  #
  # 一度 pitch -10 を入れたが、height 261 と組み合わせると **歩けなくなる**。
  # 遊脚が後ろ 40mm・上 20mm に来る隅で θ6 が -55 deg に達し、足首パラレルリンクの
  # ロッドが届かなくなる（2026-08-28 実機で AnkleUnreachable が 4 回発生。
  # 起動時の到達域チェックも ERROR で予告していた）。高さ×ピッチの走査:
  #
  #     高さ\pitch      0      -5     -10     -15     (3=design 2=mech 1=届かない)
  #        261          2       2       1       1
  #        266          2       2       2       1
  #        281          3       3       3       2
  #
  # つまり height 261 で入れられるバッファは **-5 まで**。それ以上要るなら height を
  # 上げる。しなり自体は膝の P ゲインを 32 -> 128 に上げて減らす方向で対処している。
  rpy: [0.0, 0.0, 0.0]

# ---------------------------------------------------------------------------
# 腕（ID7-10）。運動学を持たないので、T ポーズ（servo_home.yaml の原点）を 0 とした
# サーボ角をそのまま書く。脚の FK・z_c には効かない。
#
# 数字はサーボ ID をキーにすると左右共通、"R8" / "L8" のように書くと片側だけ。
# 実機のサーボが逆に回る軸は roboone_motion_node の arm_invert が反転させるので、
# ここは「左右で同じ動きをさせたい値」を書けばよい。
# ---------------------------------------------------------------------------
# 軸の並びは T ポーズ基準で ID8 = 根元のピッチ / ID9 = 根元のロール /
# ID10 = そこから少し先のヨー。ID7 は右半身にしか無く、ここでは触らない（0 = T ポーズ）。
arms:
  8:  20.0     # 根元ピッチ。腕を前へ振り出す（+ が前）
  9:  70.0     # 根元ロール。T ポーズの水平から下ろす（2026-08-28 に 50 -> 70 へ）
  10: 30.0     # 先のヨー（肘相当）。少し前に曲げる
