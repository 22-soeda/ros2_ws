# キーフレームモーション（攻撃・旋回・起き上がり）の定義。
#
# ===========================================================================
# 書式
# ===========================================================================
#   単位   位置 mm / 角度 deg / 時間 s
#   座標系 Σ_B（x 前・y 左・z 上、原点 = 骨盤 = 股 3 軸の高さ・左右中央）
#
#   motions:
#     <技名>:                     ← /cmd_motion にこの名前が載る
#       return_home: true         ← 技のあとホーム姿勢へ戻る（既定 true）
#       return_time: 0.6          ← 戻りにかける時間 [s]
#       keyframes:
#         - t: 0.25               ← ★ひとつ前の姿勢からこの姿勢までの時間（時間間隔）
#           R_foot: {p: [x, y, z], rpy: [roll, pitch, yaw]}
#           L_foot: {p: [x, y, z], rpy: [roll, pitch, yaw]}
#           arms:   {R7: 0, R8: 0, R9: 0, R10: 0, L8: 0, L9: 0, L10: 0}
#           ease: linear          ← 省略可。既定は 5 次多項式（両端で速度ゼロ）
#
# * ``t`` は絶対時刻ではなく**区間の長さ**。最初のキーフレームの t は
#   「再生を始めた瞬間の姿勢からそこへ移るまでの時間」。
# * **書かなかった項目はひとつ前のキーフレームから引き継ぐ。** 足を止めたまま腕だけ
#   振り戻すキーフレームは ``arms:`` だけ書けばよい。1 枚目が引き継ぐ相手は
#   再生開始時点の**実際の姿勢**なので、どの姿勢から撃っても繋がる。
# * 腕（ID7-10）は運動学を持たないので、T ポーズ（servo_home.yaml の原点）を 0 とした
#   サーボ角をそのまま書く。ID7 は右半身にしか無い。
# * 補間を既定で 5 次にしてあるのは、等速だとキーフレームごとに速度が階段状に飛んで、
#   二足ではそれだけで転ぶため。速度を繋ぎたくない区間だけ ease: linear にする。
#
# ===========================================================================
# 脚をサーボ角で書く（R_leg / L_leg）
# ===========================================================================
# 足裏書き（R_foot / L_foot）は IK で解ける姿勢しか書けない。**順変換では出せるのに
# IK では戻せない**領域（可動域の縁、足首の特異点の近く、寝ている姿勢）を狙う技は、
# 脚も腕と同じようにサーボ角で書く。
#
#         - t: 0.20
#           R_leg: {ID1: -12.5, ID4: 41.2}   ← T ポーズ基準 [deg]。書いた軸だけ効く
#           L_foot: {p: [...], rpy: [...]}   ← 左は今までどおり IK
#
# * 角度は腕と同じ T ポーズ基準 [deg]（servo_home.yaml の原点が 0）。
#   motion_teach の画面の「サーボ[deg]」の列そのまま（--format angle で行が出る）。
# * 軸は ID で書く。脚は ID1-ID4 と足首の ID6 / ID5。**足首は鎖の角度**であって
#   足裏のピッチ・ロールではない。「つま先を 5 度下げる」は足裏書きの仕事。
# * 同じ枚に R_foot と R_leg を両方書くと、足裏で姿勢を決めてから R_leg の軸だけ
#   上書きする（「この姿勢の膝だけもう 5 度」が書ける）。
# * **この書き方は IK も FK も通らずにサーボへ出る。** 歯止めは servo_limits.yaml の
#   窓だけで、窓の外を書くと起動時にエラーで言う（再生時は黙って丸められる）。
#   機体を組み替えると付いてこないので、届く姿勢は足裏書きのままにしておくこと。
# * 1 本の技の中で混ぜてよい。書き方が食い違う区間は**角度空間で補間する**
#   （足裏側を IK で角度に直してから混ぜる）。両端とも足裏書きの区間は今までどおり。
#
# ===========================================================================
# ホームポジションはここに書かない
# ===========================================================================
# 原本は roboone_walk_ref/config/home_pose.yaml で、**関節角**で定義されている。
# motion ノードがそれを FK して足裏の (p, R) に直す。ここに "home" を書くと
# 二重定義になるので、読み込み時に警告して捨てる。
#
# ===========================================================================
# 値の作り方 — 手で構えて捕まえる
# ===========================================================================
#   ros2 run roboone_motion motion_teach --out ~/draft.yaml
#
# 機体を脱力させて手で構え、スペースを押すとその瞬間の姿勢が下と同じ書式で出る。
# ``t:`` を狙いの時間に直してここへ貼れば 1 枚になる。捕まえるたびに
# 「その姿勢を IK で戻せるか」も確かめるので、再生できない姿勢を貼らずに済む。
# IK で戻せない姿勢を捕まえたいときは ``--format angle``（脚を R_leg / L_leg の
# サーボ角で出す）か ``--format both``（両方出して、角度側を # で殺しておく）。
# （このツールがサーボに書くのは起動時のトルク OFF 1 回だけ。）

defaults:
  return_home: true      # 技のあとホーム姿勢へ戻る
  return_time: 0.6       # [s]

motions:

  # -------------------------------------------------------------------------
  # 動作確認用。骨盤を 20mm 下げて戻すだけ。
  #
  # 歩行より先にこれを 1 本通すと、config -> IK -> 較正表 -> サーボ の経路が
  # 生きているかだけを、片脚も上げずに確かめられる。
  #
  # ★値は home_pose.yaml の foot（height 261 / x -20 / y 89.3 / rpy [0,0,0]）に
  #   合わせてある。あちらの rpy を変えたらここも揃えること。
  #   あちらを変えたらここも取り直すこと。深く沈めるほど足首ピッチ θ6 を食うので、
  #   20mm から始めて様子を見る。θ6 の余裕は home_pose.yaml の注記を参照。
  # -------------------------------------------------------------------------
  squat:
    return_home: true
    return_time: 10.0
    keyframes:
      - t: 10.00
        R_leg: {ID1:   -87.01, ID2:     2.64, ID3:     3.08, ID4:   -73.48, ID6:    83.85, ID5:  -106.61}
        L_leg: {ID1:    84.73, ID2:    -2.02, ID3:     0.70, ID4:    69.61, ID6:   -90.00, ID5:    91.93}
        arms:   {R7:   -1.05, R8:    1.32, R9:   76.64, R10:  106.08, L8:    5.19, L9:   86.92, L10:  102.92}

  # -------------------------------------------------------------------------
  # ここから下は **これから作る技**。motion_teach で捕まえた行を貼る。
  #
  # 技名は teleop の割り当て（roboone_teleop/config/ps5_dualsense.yaml の
  # motion_bindings）と一致させること。今の割り当ては
  #
  #   ○  punch_r      □  punch_l
  #   △  getup_front  ✕  getup_back
  #   十字左 turn_l    十字右 turn_r
  #
  # 定義していない技名を押しても、motion ノードが
  # 「知らない技 "punch_r" (motions.yaml に無い)」と出すだけで何も起きない。
  # だから 1 本ずつ作っていける。
  #
  # 下は貼り付ける形の見本（コメントのまま置いてある）。
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # パンチ。**腰を回しながら腕を突き出す**。足は地面に着いたまま動かさない。
  #
  #   1) 溜め  0.20 s  腰は正面のまま、突く側の腕を引いて肘をたたむ
  #   2) 突き  0.12 s  腰を回しながら肘を伸ばす（ease: linear で速度を落とさない）
  #   3) 戻し  0.25 s  腰を正面へ、腕を構えへ
  #   4) return_home 0.4 s
  #
  # ===========================================================================
  # 「腰を回す」の書き方 — 足裏をボディ座標で回す
  # ===========================================================================
  # この機体に腰の回転軸は無い。胴を回すのは**左右の股ヨー (ID3) 2 軸**で、
  # キーフレームは Σ_B（骨盤に固定した座標）で書くから、
  #
  #     胴を +ψ 回す  ==  足裏を Σ_B の中で -ψ 回す
  #
  # になる。足は地面に着いたままなので、姿勢の yaw だけでなく**位置も**
  # 骨盤まわりに回る:
  #
  #     p_B = Rz(-ψ)·p_home        rpy = [0, -10, -ψ]
  #
  # 下の数字は home_pose.yaml の (-20, ±89.3, -261) を ψ = +20 deg で回したもの。
  # home_pose.yaml の foot を変えたら、この 4 行も同じ式で取り直すこと。
  # ψ の符号は「右肩が前に出る向き」が +（上から見て反時計回り）。
  #
  # ★足裏を回すと股ヨーだけでなく**股ロール (ID2) にも 10 deg ほど乗る**。脚が
  #   前後に傾いている（x = -20 / pitch = -10）ぶん、z まわりの回転がロールに
  #   混ざるため。これが下の punch_l の制約になっている。
  # -------------------------------------------------------------------------

  # 右パンチ（○）。腰を +20 deg 回しながら右腕を突き出す。
  punch_r:
    return_home: true
    return_time: 0.4
    keyframes:
      - t: 0.20                   # 溜め: 腰は正面。右腕を引いて肘をたたむ
        R_foot: {p: [ -20.0,  -89.3,  -261.0], rpy: [   0.00,    0.00,    0.00]}
        L_foot: {p: [ -20.0,   89.3,  -261.0], rpy: [   0.00,    0.00,    0.00]}
        arms:   {R7:   0.00,
                 R8: -25.00, R9:  70.00, R10:  70.00,
                 L8:  30.00, L9:  70.00, L10:  50.00}
      - t: 0.12                   # 突き: 腰 +20 deg（足裏は -20 deg 回る）+ 肘を伸ばす
        ease: linear
        R_foot: {p: [ -49.3,  -77.1,  -261.0], rpy: [   0.00,  -10.00,  -20.00]}
        L_foot: {p: [  11.7,   90.8,  -261.0], rpy: [   0.00,  -10.00,  -20.00]}
        arms:   {R8:  70.00, R9:  75.00, R10:   0.00}
      - t: 0.25                   # 戻し: 腰を正面へ、腕を構えへ
        R_foot: {p: [ -20.0,  -89.3,  -261.0], rpy: [   0.00,    0.00,    0.00]}
        L_foot: {p: [ -20.0,   89.3,  -261.0], rpy: [   0.00,    0.00,    0.00]}
        arms:   {R8:  20.00, R9:  70.00, R10:  30.00,
                 L8:  20.00, L9:  70.00, L10:  30.00}

  # 左パンチ（□）。**腰は回していない**。腕だけ。
  #
  # ★左突きの腰の回転 (ψ = -20 deg) は、今のリミットでは出せない。
  #   胴を左へ回すと右の股ロールが + 側へ 10 deg 動くが、右 ID2 の上限が
  #   servo_limits.yaml で 2100、原点 (servo_home.yaml) が 2094 なので、
  #   **ロール 0 の時点で上限まで 0.5 deg しか無い**。ψ = -2.5 deg でもう超える
  #   （骨盤を前後左右に ±30mm ずらして逃がせないかも試したが、逃げ場は無い）。
  #   出したければ右 ID2 の上限を 2250 前後まで広げる（EEPROM 書き込み = 実機操作。
  #   先に手で回して機構が本当にそこまで動くか確かめること）。広げたら下の
  #   コメントの 4 行を 2 枚目に貼れば punch_r と対称になる:
  #     R_foot: {p: [  11.7,  -90.8,  -261.0], rpy: [   0.00,  -10.00,   20.00]}
  #     L_foot: {p: [ -49.3,   77.1,  -261.0], rpy: [   0.00,  -10.00,   20.00]}
  #   （戻しの 3 枚目は punch_r と同じ「腰 0」の 2 行）
  punch_l:
    return_home: true
    return_time: 0.4
    keyframes:
      - t: 0.20                   # 溜め: 左腕を引いて肘をたたむ
        R_foot: {p: [ -20.0,  -89.3,  -261.0], rpy: [   0.00,    0.00,    0.00]}
        L_foot: {p: [ -20.0,   89.3,  -261.0], rpy: [   0.00,    0.00,    0.00]}
        arms:   {R7:   0.00,
                 L8: -25.00, L9:  70.00, L10:  70.00,
                 R8:  30.00, R9:  70.00, R10:  50.00}
      - t: 0.12                   # 突き: 肘を伸ばす（腰は回さない。上の注記を参照）
        ease: linear
        arms:   {L8:  70.00, L9:  75.00, L10:   0.00}
      - t: 0.25                   # 戻し
        arms:   {R8:  20.00, R9:  70.00, R10:  30.00,
                 L8:  20.00, L9:  70.00, L10:  30.00}

  # turn_l:
  # turn_r:

  # -------------------------------------------------------------------------
  # 起き上がり。うつ伏せ (getup_front) / 仰向け (getup_back) の 2 本。
  #
  # 組み立て（両方に共通。全体で 2.5 s）
  #   1) 屈   脚を IK のぎりぎりまでたたむ                    0.45 s
  #   2) 押   両腕で地面を前 / 後ろへ押し、胴を足の上へ起こす  0.35 s (ease: linear)
  #   3) 立   足裏を骨盤の下に入れ、深い屈みで受ける          0.55 s
  #   4) 静止 その姿勢のまま止める                            0.25 s
  #   5) 伸   return_home で脚をホームまでゆっくり伸ばす      0.90 s
  #
  # ★4) は「t だけのキーフレーム」。書かなかった項目は引き継ぐので、これで
  #   「同じ姿勢のまま 0.25 s 止まる」になる。姿勢が落ち着く前に脚を伸ばすと、
  #   伸ばす力で機体が跳ねて元に戻るので、この 1 枚は削らないこと。
  # ★5) をキーフレームで書かないのは、ホーム姿勢の原本が home_pose.yaml だから
  #   （このファイルの冒頭を参照）。ゆっくり伸ばす時間は return_time で決める。
  #
  # 脚の値の根拠（leg_service で全キーフレームと**その間の補間点**を確認済み。
  # 確かめ方は docs/commands.md「起き上がりのキーフレームを検算する」）
  #
  #   屈 (0, ∓89.3, -170) rpy [0, +10, 0]  膝の曲げ 112.7 / 股ピッチ 58.8 /
  #       足首 θ6 -43.9 deg。**股ピッチが leg_config.hpp の可動域 60 deg の際**で、
  #       ここが「ぎりぎり」の正体。足首と膝はまだ余裕がある。
  #       つま先下げ (+10) にしてあるのは、たたむほど θ6 が負に振れて足首の窓
  #       (-55 deg) に当たるため。この pitch を 0 にすると z を -170 まで引けない。
  #   立 (-10, ∓89.3, -215) rpy [0, 0, 0]  曲げ 89.7 / 股 43.3 / θ6 -46.3 deg。
  #       ホームより 46mm 低い深い屈み。ここを ホームと同じ rpy [0,-10,0] にすると
  #       θ6 が窓に張り付く（足首が指令どおり傾かない）ので、水平で受ける。
  #
  # 腕の値は**仮**。T ポーズ基準のサーボ角で、軸は ID8 = 根元ピッチ（腕を前後に
  # 振る。+ が前）/ ID9 = 根元ロール（+ で下ろす）/ ID10 = 少し先のヨー（肘）。
  # 「どちらへ振ると地面を押せるか」は機体を寝かせてみないと決まらないので、
  #   ros2 run roboone_motion motion_teach --out ~/draft.yaml
  # で実際に寝かせた機体を手で構えて捕まえ、arms: の行を貼り替えること。
  # サーボリミット (servo_limits.yaml) には下の値で 14 deg 以上の余裕がある。
  # -------------------------------------------------------------------------

  # うつ伏せから。手を胸の下に着いて前へ押し、胴を足の上へ送る。
  getup_front:
    return_home: true
    return_time: 0.9            # 脚をホームまでゆっくり伸ばす区間
    keyframes:
      - t: 10.0
        R_leg: {ID1:   -77.70, ID2:     3.25, ID3:    -7.29, ID4:    70.00, ID6:  -297.07, ID5:   -74.36}
        L_leg: {ID1:    84.73, ID2:    -2.02, ID3:    -4.31, ID4:    70.00, ID6:   301.46, ID5:    57.83}
        arms:   {R7:    2.29, R8:   35.51, R9:   96.24, R10:   -9.40, L8:   38.58, L9:   54.40, L10:  -12.48}
      - t: 10.0
        R_leg: {ID1:   -65.39, ID2:    -5.19, ID3:    -5.45, ID4:    70.00, ID6:  -294.43, ID5:   -70.05}
        L_leg: {ID1:    78.57, ID2:    -1.23, ID3:    -2.64, ID4:    70.00, ID6:   308.76, ID5:    75.85}
        arms:   {R7:    4.22, R8:   31.38, R9:   94.83, R10:   -7.73, L8:   32.17, L9:   87.54, L10:  -11.25}
      - t: 10.0
        R_leg: {ID1:   -63.11, ID2:    -5.10, ID3:    -7.65, ID4:    70.00, ID6:  -294.43, ID5:   -70.05}
        L_leg: {ID1:    77.96, ID2:    -1.41, ID3:    -2.55, ID4:    70.00, ID6:   308.76, ID5:    75.76}
        arms:   {R7:   10.20, R8:  -19.25, R9:   89.47, R10:  104.85, L8:  -27.86, L9:   90.44, L10:  112.06}
      - t: 10.0
        R_leg: {ID1:  -106.61, ID2:    -2.29, ID3:    -9.58, ID4:    70.00, ID6:  -289.78, ID5:  -106.08}
        L_leg: {ID1:   106.79, ID2:     6.15, ID3:    -0.35, ID4:    70.00, ID6:   278.17, ID5:   102.13}
        arms:   {R7:   -2.99, R8:   37.71, R9:   92.02, R10:  106.61, L8:   29.62, L9:   88.51, L10:  112.32}
      - t: 10.0
        R_leg: {ID1:  -106.96, ID2:    -0.88, ID3:    -0.97, ID4:    70.00, ID6:  -269.30, ID5:   -93.78}
        L_leg: {ID1:   106.70, ID2:    -5.45, ID3:     0.70, ID4:    70.00, ID6:   270.53, ID5:    92.37}
        arms:   {R7:    3.08, R8:   59.41, R9:   92.99, R10:   -5.36, L8:   62.14, L9:   92.81, L10:  -10.37}
      - t: 20.0
        R_leg: {ID1:   -29.00, ID2:     1.85, ID3:     1.14, ID4:    20.00, ID6:  -336.18, ID5:   -27.33}
        L_leg: {ID1:    29.79, ID2:    -3.87, ID3:    -7.12, ID4:    20.00, ID6:   334.16, ID5:    26.19}
        arms:   {R7:    0.88, R8:   13.62, R9:   89.21, R10:  -16.08, L8:   -1.58, L9:   85.17, L10:    1.58}
      - t: 5.00                 # 静止: 引き継ぎだけ。姿勢が落ち着くのを待つ

  # 仰向けから。手を背中側の地面に着いて後ろへ押し、上体を起こす。
  getup_back:
    return_home: true
    return_time: 0.9
    keyframes:
      - t: 0.45                 # 屈: 脚をたたみながら、手を背中側の地面へ回す
        R_foot: {p: [   0.0,  -89.3,  -170.0], rpy: [   0.00,   10.00,    0.00]}
        L_foot: {p: [   0.0,   89.3,  -170.0], rpy: [   0.00,   10.00,    0.00]}
        arms:   {R7:   0.00,
                 R8: -70.00, R9:  60.00, R10: -40.00,
                 L8: -70.00, L9:  60.00, L10: -40.00}
      - t: 0.35                 # 押: 腕を前へ払って地面を後ろへ押し、上体を起こす
        ease: linear
        arms:   {R8:  10.00, R9:  60.00, R10:  10.00,
                 L8:  10.00, L9:  60.00, L10:  10.00}
      - t: 0.55                 # 立: 足裏を骨盤の下へ入れ、深い屈みで受ける
