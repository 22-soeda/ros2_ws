# motion ノードのパラメータ。
#
#   ros2 launch roboone_motion motion.launch.py
#   ros2 run roboone_motion motion_node --ros-args --params-file <このファイル>
#
# 姿勢の定義そのものはここに無い。原本は
#   ホーム姿勢   roboone_walk_ref/config/home_pose.yaml   (関節角)
#   歩行の設定   roboone_walk_ref/config/gait.yaml        (LIPM のパラメータ)
#   技           roboone_motion/config/motions.yaml (キーフレーム)
#   原点 / リミット feetech_servo/config/servo_home.yaml, servo_limits.yaml

/**:
  ros__parameters:

    # --- バス -------------------------------------------------------------
    # ttyACM の番号は入れ替わるので udev の固定名を使う（ID7 がある側が右半身）。
    port_right: "/dev/feetech_right"
    port_left: "/dev/feetech_left"
    baud: 1000000

    # HLS 系は位置指令パケットの 44/45 が GOAL_TORQUE。**0 だと全軸まったく動かない。**
    # SMS/STS 系ではここは GOAL_TIME になるので、繋ぎ替えたら feetech_bus 側の
    # Family を直すこと。
    #
    # これは Target Current の**上限**（0-2047）で、常にこれだけ流すわけではない。
    # 2047 = 制限を掛けない（feetech_shell の既定と同じ）。
    goal_torque: 2047

    # 位置指令パケットに載せる速度 (reg46/47) と加速度 (reg41)。
    #
    # ★0 にしないこと。この実機 (HLS 系) は速度 0 だと目標位置を受け取っても動かない。
    #   同じパケットの 44/45 = GOAL_TORQUE に 0 を書くと全軸まったく動かないのと同じ
    #   性質で、0 は「無制限」ではない。2026-08-28 に 0 のまま実機で
    #   「トルクは入るが動かない」を踏んでいる。
    #   200Hz で目標を流すので、軌道が速度で頭打ちにならない値にしておく。
    #
    # 加速度の単位は 100 step/s^2（0-254）。254 = 25400 step/s^2 ≒ 39 rad/s^2 で、
    # 明示できる最大値。2026-09-16 に 50 (≒ 7.7 rad/s^2) から上げた。50 だと遊脚の膝が
    # 最高速度 1.87 rad/s に乗るまで 0.24s かかり（持ち上げ区間は 0.27s）、足首の
    # 安定化の補正にも追従しなかった。ベンダ資料では 0 が「最大」だが、速度・トルクと
    # 同じく 0 を「無効」として扱う恐れがあるので、実機で確かめるまで 0 は使わない。
    move_speed: 2000
    move_acc: 254

    # --- 周期 -------------------------------------------------------------
    loop_hz: 200.0          # 制御ループ。ros-architecture §3 の 200Hz
    read_hz: 50.0           # サーボ状態の読み出し。1 往復かかるので書き込みより遅くする
    joint_state_hz: 10.0    # /joint_states

    # --- 安全 -------------------------------------------------------------
    # サーボにトルクを入れてよいか。**通常運用の既定は true**（機体は動く）。
    #
    # false にすると、バスは開いて読むが enable_torque(true) と位置指令の送信だけを
    # 行わない。歩行計画・IK・モーション再生・/joint_states は実測値を使って全部回るので、
    # 機体を動かさずに操縦系・config・軌道の通し確認ができる。
    # 実装中の検証で走らせるときはこれを落とす（CLAUDE.md「実装中の検証では
    # トルクを入れない」）。バスも開きたくないときは下の dry_run。
    allow_torque: true

    # /cmd_walk がこれだけ途切れたら指令ゼロとみなす（最後の指令を保持しない）。
    # teleop は静止中も 20Hz でゼロを送り続けるので、途切れ = 送り手が消えた。
    cmd_timeout: 0.5

    # トルクを入れてから保持姿勢へ移るまでの時間。**実測姿勢が起点**なので、
    # 転がっている機体にトルクを入れてもいきなり跳ねない。短くしないこと。
    torque_on_time: 2.0

    # /cmd_motion "home" でホーム姿勢へ移る時間。
    home_move_time: 1.5

    # /cmd_motion "hold" (その場保持) で武装するときの補間時間。実測姿勢をそのまま
    # 保持姿勢にするので補間距離はゼロ。短くてよいが、0 にはしない (player の最短 0.05s)。
    # 転倒 → 脱力 → その場保持 → 起き上がり の経路 (docs/無線操縦_不足項目レビュー.md §4.3)。
    hold_arm_time: 0.5

    # 起動直後の latched な /estop false では武装しない。teleop は起動時に
    # estop=false を撒くので、これが false だと launch しただけでサーボに電気が
    # 入ってホーム姿勢へ動き出す。/cmd_motion を 1 回受けるまで脱力のままにする
    # （teleop の Options 長押しは home -> estop false の順に来るので操作は変わらない）。
    require_home_before_arm: true

    # --- 腕（ID7-10。運動学を持たない軸）---------------------------------
    # 実機のサーボが Σ_B の正方向と逆に回る軸をここに並べる。脚は
    # leg_config.hpp の AXIS_FLIP が同じ役目を持つが、腕は運動学が無いのでここ。
    # 左右対称に組んだぶん出力軸の向きが反転する軸がある（膝・足首と同じ事情）。
    # 2026-08-28 実機で R8 / L9 / R10 が逆に回るのを確認。
    arm_invert: ["R8", "L9", "R10"]

    # --- 歩行 -------------------------------------------------------------
    walk_enable: true

    # 歩行計画の足位置に足す左右方向のオフセット [mm]（+ で外側）。実機の足は
    # ±(gait.yaml の foot_spacing / 2 + これ)。横方向の力学は foot_spacing の値で
    # 計画されるので、計画を広く・実機の足をそのままにすると、骨盤の横振りだけが増える。
    #
    # 2026-09-17: foot_spacing 170mm に対して -15 → 実機の足は ±70mm（校正値のまま）。
    # 単脚支持で遊脚側へ倒れるのを止めるため（理由と候補の表は gait.yaml の foot_spacing）。
    # HOLD の立位もこの足位置になる（tickWalk が上書きする）。起動時にしか読まない。
    stance_y_offset: -15.0

    # 歩行中に技の指令が来たら、歩行を打ち切って技に入る。false にすると無視する。
    # 転んだ機体を起こす指令が「歩行中だから」で捨てられると詰むので既定 true。
    motion_interrupts_walk: true

    # --- IMU（RealSense 内蔵。/camera/imu の生値から姿勢を出す）--------------
    # 中身は include/roboone_motion/imu_attitude.hpp。RealSense は roboone.launch.py の
    # imu:=true（既定）か camera:=true で上がる。来なければ起動 10 秒後に警告が出て、
    # 安定化は補正 0 のまま動く（歩行・技はそのまま使える）。
    #
    # ★double のパラメータは必ず小数点を付けて書く（0 ではなく 0.0）。整数で書くと
    #   型違いで motion ノードが起動しない。
    imu:
      topic: "/camera/imu"
      # カメラの取り付けの傾き (roll, pitch, yaw) [deg]。pitch + でカメラが下を向く。
      # この機体のカメラは胴体に対して水平に付いているので 0（2026-09-16 確認。
      # roboone_perception の cam_pitch_deg = 30 は取り付けの角ではない）。
      # 組み付けの誤差は、胴体が水平だと分かっている状態（水準器を当てる等）で
      #   ros2 service call /motion/imu_zero std_srvs/srv/Trigger
      # を呼んで取り、ログに出る値をここへ書き写す（書かないと再起動で戻る）。
      # ★ホーム姿勢で立たせて呼ばないこと。立位の後傾（膝のしなり）まで 0 と覚える。
      mount_rpy_deg: [0.0, 0.0, 0.0]
      tau_c: 1.0            # [s] 加速度で傾きを引き戻す時定数。長いほどジャイロを信じる
      gyro_lpf_hz: 30.0     # [Hz] 減衰項に入れる角速度の LPF。0 で素通し
      accel_band: 0.25      # |f| が g からこの割合外れたら加速度を使わない
      # 歩行計画の重心加速度 ω²(x_C − p) を比力から引いてから傾きを出す。引かないと
      # 歩行の横揺れ（±2.6 m/s^2）でロールの推定が数度ずれる（motion_selftest [7]）
      accel_ff: true

    # --- 安定化（足首戦略と胴体の補正）----------------------------------------
    # 中身は include/roboone_motion/stabilizer.hpp。**ゲインの既定は全部 0**
    # （入れても今までと同じ動き）。実行中に変えられる:
    #
    #   ros2 param set /motion stab.kd_pitch 0.05
    #
    # 入れる順番（docs/ros2_walk_implementation.pdf §9）:
    #   1) ゲイン 0 で立たせ、押して戻るか見る
    #   2) kd_pitch / kd_roll を上げる。振動が出る手前まで上げて 2〜3 割戻す（目安 0.05）
    #   3) kp_pitch / kp_roll を上げる。傾いたまま戻らない分が減るのを見る
    #   4) k_torso を 0 から上げる
    #   5) 足踏み → 低速前進で 2), 3) を取り直す
    # 見るものは /motion/stab（並びは motion_node.cpp の kStabFields）。
    stab:
      enable: true
      kd_pitch: 0.1         # [rad/(rad/s)] 足首ピッチのジャイロ減衰
      kd_roll: 0.1          # [rad/(rad/s)] 足首ロールのジャイロ減衰
      kp_pitch: 1.0         # [rad/rad] 足首ピッチの傾き比例
      kp_roll: 1.0          # [rad/rad] 足首ロールの傾き比例
      k_torso: 0.0          # [rad/rad] 胴体を起こす股の補正（前後のみ）
      ankle_clamp: 0.12     # [rad] 足首の補正の上限（1 軸あたり。約 7 deg）
      torso_clamp: 0.15     # [rad] 胴体の補正の上限
      rate_limit: 4.0       # [rad/s] 補正の変化の速さの上限
      gate_pre_td: 0.03     # [s] 予定の着地のこれだけ前から
      gate_post_td: 0.02    # [s] これだけ後まで、ゲインを
      gate_scale: 0.5       #     この倍率に弱める（着地の衝撃で減衰項が暴れるのを防ぐ）
      fade_time: 0.5        # [s] 補正を入れる・抜くのにかける時間
      imu_timeout: 0.1      # [s] これより古い IMU は使わない
      lift_phase: 0.10      # 遊脚の補正を抜き切る歩の位相
      debug_hz: 100.0       # /motion/stab の周期 [Hz]（起動時にだけ読む）

    # --- 開発用 -----------------------------------------------------------
    # true にするとバスを開かない。config と IK の通し確認だけしたいときに使う。
    dry_run: false
