# realsense2_camera_node のパラメータ。
#
# ここには「この機体での定常的な選択」だけを置く。ストリームの ON/OFF は
# launch 引数側（launch/realsense.launch.py）で決めるので、ここには書かない。
#
# ノード名に依存しないよう `/**` ワイルドカードを使う。ノードは
# namespace="" / name="camera" で起動するので、トピックは /camera/... になる
# （docs/ros-architecture.md のトピック表 /camera/imu, /camera/…/points に一致）。
#
# 注意: realsense のパラメータ名は "depth_module.depth_profile" のようにドットを
# 含む。ROS のパラメータファイルではドットを直接キーに書けないので、下のように
# ネストして書く（パーサが '.' で連結して元の名前に戻す）。
/**:
  ros__parameters:

    depth_module:
      # ---- depth -------------------------------------------------------
      # 848x480x30 はこの Pi の RSUSB バックエンドで実測安定（30.0Hz 出る）。
      # 640x480x30 に落とすと CPU/帯域にさらに余裕が出る。90/60fps も選べるが
      # 60fps 以上を RGB と同時に使うと USB 帯域がぎりぎりになる。
      # 形式は "WxHxFPS"。選べる値は `rs-enumerate-devices` で確認できる。
      depth_profile: "848x480x30"
      depth_format: "Z16"
      enable_auto_exposure: true

    rgb_camera:
      # ---- color（launch で enable_color:=true にしたときだけ効く） -------
      # 1280x720x30 は depth 848x480x30 と同時でも実測安定。
      # 1920x1080 は 30fps に届かないので使わない（実測済み）。
      color_profile: "1280x720x30"
      color_format: "RGB8"
      enable_auto_exposure: true

    # ---- IMU -----------------------------------------------------------
    # D435if の対応レート: Accel 400/200/100Hz, Gyro 400/200Hz。
    # unite_imu_method=2 (linear_interpolation) は accel を gyro の時刻へ線形補間し、
    # gyro と同レート（=200Hz）の /camera/imu を1本 publish する。
    # 1 は copy（補間せず直近の accel を流用）、0 は united トピックを作らない。
    # 200Hz は docs/ros-architecture.md の /camera/imu 目安周期に合わせた値。
    gyro_fps: 200
    accel_fps: 200
    unite_imu_method: 2

    # imu_filter_madgwick に渡す共分散。実測でチューニングするまでの暫定値。
    # （静止時のばらつきは test/rs_imu_test で測れる）
    angular_velocity_cov: 0.01
    linear_accel_cov: 0.01

    # ---- 点群 -----------------------------------------------------------
    # 点群フィルタのパラメータは接頭辞が環境依存（この Pi では pointcloud__neon_）
    # なので、ここではなく launch/realsense.launch.py 側で組み立てている。

    # ---- 後処理フィルタ ------------------------------------------------
    # すべて OFF。Pi5 の CPU を motion ノードへ回すため、素の depth を出す。
    # 床面除去のノイズが問題になったら spatial/temporal から試す。
    decimation_filter:
      enable: false
    spatial_filter:
      enable: false
    temporal_filter:
      enable: false
    hole_filling_filter:
      enable: false
    disparity_filter:
      enable: false

    # ---- その他 --------------------------------------------------------
    publish_tf: true
    tf_publish_rate: 0.0     # 0 = static TF を1回だけ。カメラは機体固定なので動的TFは不要
    clip_distance: -2.0      # 負値 = 距離クリップ無効
    diagnostics_period: 0.0  # 0 = /diagnostics を出さない
    # USB がこけた時の再接続待ち。RSUSB バックエンドでは切断が起きうるので有効にしておく。
    reconnect_timeout: 6.0
    wait_for_device_timeout: -1.0
