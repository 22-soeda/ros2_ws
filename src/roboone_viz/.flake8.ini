# ament_flake8 の既定設定のコピーに D400 を足したもの。
# D400/D415 は docstring 冒頭行が "." 等で終わることを要求するが、この ws の
# コメント/docstring は日本語で文末が "。" になるため原理的に通らない。
# D213 は ament が既定で無視している D212 と排他の規約なので併せて外す。
[flake8]
extend-ignore = D400,D415,D213,B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
