# PS5 DualSense の割り当て。
#
# index は SDL の GameController 標準配列 (= joy パッケージの game_controller_node
# が出す順) を前提にしている。SDL が DualSense の対応表を内蔵しているので、生の
# joy_node と違ってカーネル側の並びに左右されない。これが既定を game_controller_node
# にしている理由 (launch/teleop.launch.py の joy_backend)。
#
# 実機で必ず `ros2 run roboone_teleop joy_probe` を回して確認すること。
# joy_node (生の SDL Joystick) に切り替えた場合は並びが変わるので、この表もそのまま
# では使えない。
#
#   ボタン  0 ✕ / 1 ○ / 2 □ / 3 △ / 4 Create / 5 PS / 6 Options
#           7 L3 / 8 R3 / 9 L1 / 10 R1 / 11-14 十字 上下左右 / 20 タッチパッド
#   軸      0 左スティック左右 / 1 左スティック上下
#           2 右スティック左右 / 3 右スティック上下 / 4 L2 / 5 R2
#
# 指令の一覧:
#   並行移動        左スティック (斜めも。旋回は混ざらない)
#   旋回            右スティック 左右
#   パンチ          ○ 右 / □ 左
#   起き上がり      △ 前 / ✕ 後          ★自律動作への割り込み
#   脱力            L1      (即時)        ★自律動作への割り込み
#   ホームポジション Options (1 秒長押し)  ★自律動作への割り込み
#   無線テスト      Create  (押している間) ★自律動作への割り込み
#   自律動作        十字キー 上 (1 秒長押し)

/**:
  ros__parameters:

    rate_hz: 20.0          # /cmd_walk の送信周期 (ros-architecture §4 の 20Hz)
    joy_timeout: 0.5       # /joy がこれだけ途切れたら脱力する
    deadzone: 0.12         # スティックの遊び。DualSense は中央が微妙にずれる

    # --- 並行移動と旋回 ---------------------------------------------------
    # 左スティックは linear だけ、右スティックは angular だけに入れる。混ぜない。
    # 斜めに歩くときに機体が勝手に旋回すると、狙った方向へ進まなくなる。
    axes:
      walk_x: 1            # 左スティック 上下 → linear.x  (前後)
      walk_y: 0            # 左スティック 左右 → linear.y  (左右並行移動)
      walk_yaw: 2          # 右スティック 左右 → angular.z (旋回)

    invert:
      # 3 つとも false。**joy ノードが既に符号を反転して publish している。**
      #
      # SDL 自体は「下 = +」「右 = +」だが、ROS の joy パッケージはそれを反転して
      # 出すので、/joy の時点で既に ROS 規約 (前 = +x / 左 = +y / 反時計 = +yaw) に
      # なっている。ここで重ねて反転すると全部逆を向く。
      #
      # 2026-08-28 実機実測 (DualSense + game_controller_node):
      #   左スティックを前へ  → axes[1] = +0.77
      #   左スティックを左へ  → axes[0] = +0.87
      #   右スティックを左へ  → axes[2] = +0.88
      # 反転している証拠: 無操作時に L2/R2 (axes[4], axes[5]) が 0.0 ではなく
      # -0.0 で出る。負のゼロは値を反転しないと生まれない。
      walk_x: false
      walk_y: false
      walk_yaw: false

    scale:
      # ★仮の値。歩行パターン生成 (作る順番 §5 の 3) ができてから実測で詰める。
      #   最初は「歩けるより遅い」側に振っておく。
      #   斜め歩きでは x と y が同時に立つので、合成速度は最大 sqrt(x^2+y^2)。
      x: 0.06              # m/s
      y: 0.03              # m/s
      yaw: 0.40            # rad/s

    accel:
      # 1 秒あたりの指令変化量の上限。二足で速度指令が階段状に飛ぶと転ぶ。
      x: 0.15              # m/s^2
      y: 0.10
      yaw: 1.50            # rad/s^2

    # --- ボタン -----------------------------------------------------------
    buttons:
      deadman: "b10"       # R1 … 押している間だけ /cmd_walk に値が乗る
      relax: "b9"          # L1 … 脱力 (トルクOFF)。押した瞬間にラッチ
      home: "b6"           # Options … home_hold 秒の長押しでホームポジション
      link_test: "b4"      # Create … 押している間ブザー + LED (無線の疎通確認)
      autonomy: "b11"      # 十字キー 上 … autonomy_hold 秒の長押しで自律動作

    # 脱力を L1 に置いてあるのは、歩かせている最中 (R1 + スティック) に左手の
    # 人差し指だけで即座に押せて、しかも歩行操作と指が競合しないから。
    # ホームと自律は逆に、誤って触っても発動しないよう遠く・長押しにする。

    # --- ホームポジション -------------------------------------------------
    # 「全軸にホームの目標角を送ってから、トルクを入れる」の 2 段。
    # 順番が逆だと、サーボに残っている古い目標角へ飛んでからホームへ動く。
    # 1 tick で両方投げると motion 側の受信順が保証されないので、わざと間を空ける。
    home_hold: 1.0                  # 長押し時間。誤発動防止なので短くしない
    home_motion: "home"             # 先に送る技名 (/cmd_motion)
    home_torque_delay: 0.1          # この秒数あけて /estop false を送る

    # --- 自律動作 ---------------------------------------------------------
    # 押すと /autonomy true を出し、behavior ノードに指令権を渡す。teleop は
    # /cmd_walk を出すのをやめる (2 重 publish の奪い合いを避けるため)。
    # 止めるのは 起き上がり / 脱力 / 無線確認ブザー / ホームポジション の 4 つ。
    autonomy_hold: 1.0
    autonomy:
      stop_on_joy_loss: true        # 電波が切れたら自律も止めて脱力する
      # ★false にすると電波断でも自律を続ける。非常停止の手が無くなるので、
      #   使うなら物理スイッチなど別の停止手段を用意してから。

    motion_bindings:
      # "<割り当て>:<技名>"。技名はそのまま /cmd_motion (std_msgs/String) に載る。
      # ★motion ノード側の技名と一致させること。
      - "b1:punch_r"       # ○  パンチ 右   (右側のボタン = 右手)
      - "b2:punch_l"       # □  パンチ 左   (左側のボタン = 左手)
      - "b3:getup_front"   # △  起き上がり 前 (上のボタン = うつ伏せから)
      - "b0:getup_back"    # ✕  起き上がり 後 (下のボタン = 仰向けから)

    motion_interrupts:
      # ここに挙げた技はデッドマン不要で、押すと自律動作を止める。
      # 転んだ機体を起こすのに R1 を押させると、自律動作からの割り込みが成立しない。
      - "getup_front"
      - "getup_back"

    motion_requires_deadman: true   # 上記以外の技はデッドマンを押している間だけ
    motion_cooldown: 0.5            # 連射防止 (秒)

    # --- 無線テスト -------------------------------------------------------
    # 機体を脱力させたまま、離れた場所で電波が届くかを確かめるための機能。
    # デッドマン不要・脱力中でも動く (動作条件を付けると用を成さない)。
    link_test:
      buzzer: "beep"                # ui ノードのブザープリセット名
      buzzer_hz: 15.0               # 再送周期。beep は 80ms で鳴り止むので繋がって聞こえる
      stale: 0.15                   # /joy がこれだけ途切れたら即鳴り止む
                                    # (脱力までの joy_timeout 0.5s を待たない。
                                    #  電波の切れ目を耳で探すのが目的なので)

    # --- 状態表示 (ui ノードへ) -------------------------------------------
    # 操作者からは「今どのモードか」が機体を見ても分からない。特に自律動作中は
    # teleop が /cmd_walk を黙るので、behavior が起動していないと「入れたのに
    # 動かない」になり、故障と区別が付かない。状態が変わるたびに OLED と LED へ出す。
    #
    # 色は teleop 側に持たない。ui のプリセット名だけを送り、実際の色は ui が
    # 決める (roboone_ui の LED_PATTERNS)。色を 1 箇所で管理できるのと、無線テストが
    # 終わったときに「元の状態のプリセットをもう一度送る」だけで復帰できる利点がある。
    ui:
      enable: true
      pattern:
        nolink: "dark"      # /joy がまだ来ていない      … 消灯
        relax: "estop"      # 脱力 (トルクOFF)           … 赤の速い点滅
        unarmed: "warn"     # デッドマンの再武装待ち      … 黄の点滅
        manual: "ready"     # 武装済み。R1 で歩ける      … 緑の点灯
        auto: "auto"        # 自律動作中                … 青の点滅
        link: "link"        # 無線テスト中              … シアンの点灯
      buzzer:
        # 「操作者が画面を見ていなくても気付くべき変化」だけ鳴らす。
        relax: "error"      # 脱力に落ちた
        auto: "ack"         # 自律動作に入った
        manual: "beep"      # 武装した (歩ける状態になった)
