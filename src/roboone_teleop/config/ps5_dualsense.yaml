# PS5 DualSense の割り当て。
#
# index は SDL の GameController 標準配列 (= joy パッケージの game_controller_node
# が出す順) を前提にしている。SDL が DualSense の対応表を内蔵しているので、生の
# joy_node と違ってカーネル側の並びに左右されない。これが既定を game_controller_node
# にしている理由 (launch/teleop.launch.py の joy_backend)。
#
# 実機で必ず `ros2 run roboone_teleop joy_probe` を回して確認すること。
# joy_node (生の SDL Joystick) に切り替えた場合は並びが変わるので、この表もそのまま
# では使えない。
#
#   ボタン  0 ✕ / 1 ○ / 2 □ / 3 △ / 4 Create / 5 PS / 6 Options
#           7 L3 / 8 R3 / 9 L1 / 10 R1 / 11-14 十字 上下左右 / 20 タッチパッド
#   軸      0 左スティック左右 / 1 左スティック上下
#           2 右スティック左右 / 3 右スティック上下 / 4 L2 / 5 R2
#
# 指令の一覧:
#   並行移動   左スティック (斜めも。旋回は混ざらない)
#   旋回       右スティック 左右
#   パンチ     ○ 右 / □ 左
#   起き上がり △ 前 / ✕ 後
#   脱力       L1        (即時)
#   トルクオン Options   (1 秒長押し)
#   無線テスト Create    (押している間)

/**:
  ros__parameters:

    rate_hz: 20.0          # /cmd_walk の送信周期 (ros-architecture §4 の 20Hz)
    joy_timeout: 0.5       # /joy がこれだけ途切れたら脱力する
    deadzone: 0.12         # スティックの遊び。DualSense は中央が微妙にずれる

    # --- 並行移動と旋回 ---------------------------------------------------
    # 左スティックは linear だけ、右スティックは angular だけに入れる。混ぜない。
    # 斜めに歩くときに機体が勝手に旋回すると、狙った方向へ進まなくなる。
    axes:
      walk_x: 1            # 左スティック 上下 → linear.x  (前後)
      walk_y: 0            # 左スティック 左右 → linear.y  (左右並行移動)
      walk_yaw: 2          # 右スティック 左右 → angular.z (旋回)

    invert:
      # SDL は「下 = +」「右 = +」。ROS は「前 = +x」「左 = +y」「反時計 = +yaw」なので
      # 3 つとも反転する。実機で逆を向いたらここを false にする。
      walk_x: true
      walk_y: true
      walk_yaw: true

    scale:
      # ★仮の値。歩行パターン生成 (作る順番 §5 の 3) ができてから実測で詰める。
      #   最初は「歩けるより遅い」側に振っておく。
      #   斜め歩きでは x と y が同時に立つので、合成速度は最大 sqrt(x^2+y^2)。
      x: 0.06              # m/s
      y: 0.03              # m/s
      yaw: 0.40            # rad/s

    accel:
      # 1 秒あたりの指令変化量の上限。二足で速度指令が階段状に飛ぶと転ぶ。
      x: 0.15              # m/s^2
      y: 0.10
      yaw: 1.50            # rad/s^2

    # --- ボタン -----------------------------------------------------------
    buttons:
      deadman: "b10"       # R1 … 押している間だけ /cmd_walk に値が乗る
      relax: "b9"          # L1 … 脱力 (トルクOFF)。押した瞬間にラッチ
      torque_on: "b6"      # Options … torque_on_hold 秒の長押しでトルクオン
      link_test: "b4"      # Create … 押している間ブザー + LED (無線の疎通確認)

    # 脱力を L1 に置いてあるのは、歩かせている最中 (R1 + スティック) に左手の
    # 人差し指だけで即座に押せて、しかも歩行操作と指が競合しないから。
    # トルクオンは逆に、誤って触ってもトルクが入らないよう遠く・長押しにする。
    torque_on_hold: 1.0

    motion_bindings:
      # "<割り当て>:<技名>"。技名はそのまま /cmd_motion (std_msgs/String) に載る。
      # ★motion ノード側の技名と一致させること。
      - "b1:punch_r"       # ○  パンチ 右   (右側のボタン = 右手)
      - "b2:punch_l"       # □  パンチ 左   (左側のボタン = 左手)
      - "b3:getup_front"   # △  起き上がり 前 (上のボタン = うつ伏せから)
      - "b0:getup_back"    # ✕  起き上がり 後 (下のボタン = 仰向けから)

    motion_requires_deadman: true   # 技もデッドマンを押している間だけ受け付ける
    motion_cooldown: 0.5            # 連射防止 (秒)

    # --- 無線テスト -------------------------------------------------------
    # 機体を脱力させたまま、離れた場所で電波が届くかを確かめるための機能。
    # デッドマン不要・脱力中でも動く (動作条件を付けると用を成さない)。
    link_test:
      color: [0, 200, 255]          # 押している間の LED 色 (シアン)
      release_color: [0, 0, 0]      # 離したら消す
      buzzer: "beep"                # ui ノードのブザープリセット名
      buzzer_hz: 15.0               # 再送周期。beep は 80ms で鳴り止むので繋がって聞こえる
      stale: 0.15                   # /joy がこれだけ途切れたら即鳴り止む
                                    # (脱力までの joy_timeout 0.5s を待たない。
                                    #  電波の切れ目を耳で探すのが目的なので)
