feetech_demo:
  ros__parameters:
    # 2台のコントローラ = 2本のシリアルバス。
    # ★/dev/ttyACMn は「見つかった順」の連番で挿し順・再列挙で入れ替わるので使わない。
    #   hw/99-feetech.rules がシリアル番号から固定名を振っている (README「固定名」参照)。
    ports:
      - "/dev/feetech_right"    # ID 1-10 (ID 7 がある方)
      - "/dev/feetech_left"     # ID 1-6, 8-10 (ID 7 は欠番)
    baud: 1000000

    # 全バス共通の軸ID。バスごとに変えたい場合は ids_0 / ids_1 で上書きする。
    ids: [1]
    # ids_0: [1, 2, 3]
    # ids_1: [1, 2, 3]

    rate_hz: 50.0        # 閉ループ周波数（書き→読みを1サイクル）

    # 安全: 既定は読み取りのみ（トルクOFF, 機体は動かない）。
    # 実際に動かす場合のみ true にする。
    enable_motion: false
    amplitude_deg: 20.0  # 起点位置まわりのサイン波振幅
    period_s: 4.0        # サイン波の周期
    move_speed: 2000     # SyncWritePosEx の速度 (step/s)
    move_acc: 50         # SyncWritePosEx の加速度
