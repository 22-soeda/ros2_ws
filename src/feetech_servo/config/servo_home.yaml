# サーボの初期位置（原点）オフセット。feetech_calibrate_home が生成（2026-08-27 21:30）。
#
#   home   … その軸を狙いの姿勢に合わせたときの生カウント (0-4095)
#   offset … home - 2048（中央からのずれ。参考値）
#
# 使い方（狙いの姿勢を 90.0 deg と定義した場合）:
#   指令カウント = home + (狙い角[deg] - 90.0) * 4096 / 360
#   現在角[deg]  = 90.0 + (現在カウント - home) * 360 / 4096
#
# 手で合わせ直したくなったら: ros2 run feetech_servo feetech_calibrate_home
# （--bus/--id で1軸だけやり直せる。このファイルは軸ごとにマージされる）

center: 2048
home_deg: 90.0

buses:
  - port: /dev/ttyACM0
    servos:
      1:   {home: 2025, offset:   -23}   # 178.0 deg  (前回の値)
      2:   {home: 2077, offset:    29}   # 182.5 deg  (前回の値)
      3:   {home: 2021, offset:   -27}   # 177.6 deg  (前回の値)
      4:   {home: 2095, offset:    47}   # 184.1 deg  (前回の値)
      5:   {home: 1971, offset:   -77}   # 173.2 deg  (前回の値)
      6:   {home: 2133, offset:    85}   # 187.5 deg  (前回の値)
      8:   {home: 2042, offset:    -6}   # 179.5 deg  (前回の値)
      9:   {home: 2084, offset:    36}   # 183.2 deg  (前回の値)
      10:  {home: 2064, offset:    16}   # 181.4 deg  (前回の値)
  - port: /dev/ttyACM1
    servos:
      1:   {home: 2143, offset:    95}   # 188.3 deg  (前回の値)
      2:   {home: 2101, offset:    53}   # 184.7 deg  (前回の値)
      3:   {home: 2068, offset:    20}   # 181.8 deg  (前回の値)
      4:   {home: 1835, offset:  -213}   # 161.3 deg  (前回の値)
      5:   {home: 2193, offset:   145}   # 192.7 deg  (前回の値)
      6:   {home: 2033, offset:   -15}   # 178.7 deg  (前回の値)
      8:   {home: 2091, offset:    43}   # 183.8 deg  (前回の値)
      9:   {home: 2014, offset:   -34}   # 177.0 deg  (前回の値)
      10:  {home: 1951, offset:   -97}   # 171.5 deg  (前回の値)
