# サーボの角度リミット（EEPROM addr 9 = MIN_ANGLE_LIMIT / addr 11 = MAX_ANGLE_LIMIT）。
#
#   ros2 run feetech_servo feetech_set_limits --dry-run   # 何を書くかだけ表示
#   ros2 run feetech_servo feetech_set_limits             # 確認プロンプトのあと一括書き込み
#
# 値は生カウント（0-4095 = 0-360deg）。書式は [下限, 上限] または {min: , max: }。
#   - 下限 = 上限 = 0 … 制限なし（多回転可）。工場出荷/現在の全軸の値。
#   - 下限 > 上限 は不正。ファームが目標位置をその窓に丸めて動かなくなるので、このツールは拒否する。
#   - 現在の値と同じ軸は書き込まない（EEPROM の書き換え回数を無駄にしないため）。
#
# 参考: 現在の実測値は docs/servo-registers.md。90deg = 1024, 180deg = 2048, 270deg = 3072。
#
# ---------------------------------------------------------------------------
# 足首（ID5 / ID6）は運動学から決めている
# ---------------------------------------------------------------------------
# ID5・ID6 は足首パラレルリンクのクランクを回す。ここの窓は手加減ではなく
# roboone_kinematics/include/roboone_kinematics/ankle_config.hpp の
# CRANK_LIMIT_DEG = ±60 deg を servo_home.yaml の home でカウントに直したもの。
#
#   count = home + φ * 4096/360     φ = σ_i · (q - q_i,neutral)   （§4.5）
#
# 値は次で印字する（--home は servo_home.yaml の ID6・ID5 の home の順）:
#   ros2 run roboone_kinematics ankle_dump --limits --home 2133 1971            # 左
#   ros2 run roboone_kinematics ankle_dump --limits --home 2033 2193 --right    # 右
# home を取り直したら**この 4 行も取り直すこと**（home がずれると窓もずれる）。
#
# ★注意: この窓は「機体を守るため」であって、足首の型 2 特異点（θ6 = -65 deg）
#   を防ぐものではない。特異点は (q1,q2) 平面の中の曲線なので、軸ごとの箱では
#   囲えない（ankle_config.hpp の TH6_SINGULAR_DEG を読むこと）。特異点を避ける
#   のはソフト側の仕事で、ankleClampJoints()（指令）と ankleFk() の窓（観測）が
#   受け持つ。

baud: 1000000

buses:
  - port: /dev/feetech_left
    servos:
      # ID: [下限, 上限]
      1:  [1000, 3100]
      2:  [1800, 3100]
      3:  [0, 0]
      4:  [1900, 3100]
      5:  [1272, 2637]   # 足首: crank ±60 deg（home 1971・σ=+1）
      6:  [1449, 2814]   # 足首: crank ±60 deg（home 2133・σ=-1）
      # ID7 は欠番
      8:  [1000, 3000]
      9:  [1050, 3100]
      10: [1000, 3100]

  - port: /dev/feetech_right
    servos:
      1:  [1100, 3200]
      2:  [1000, 2100]
      3:  [0, 0]
      4:  [850, 2050]
      5:  [1527, 2892]   # 足首: crank ±60 deg（home 2193・σ=-1）
      6:  [1352, 2717]   # 足首: crank ±60 deg（home 2033・σ=+1）
      # 右半身のみ ID7 がある（左は欠番）。可動域が決まったら書き換える
      7:  [950, 3050]
      8:  [1050, 3100]
      9:  [950, 3000]
      10: [950, 3050]
