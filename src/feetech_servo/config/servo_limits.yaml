# サーボの角度リミット（EEPROM addr 9 = MIN_ANGLE_LIMIT / addr 11 = MAX_ANGLE_LIMIT）。
#
#   ros2 run feetech_servo feetech_set_limits --dry-run   # 何を書くかだけ表示
#   ros2 run feetech_servo feetech_set_limits             # 確認プロンプトのあと一括書き込み
#
# 値は生カウント（0-4095 = 0-360deg）。書式は [下限, 上限] または {min: , max: }。
#   - 下限 = 上限 = 0 … 制限なし（多回転可）。工場出荷/現在の全軸の値。
#   - 下限 > 上限 は不正。ファームが目標位置をその窓に丸めて動かなくなるので、このツールは拒否する。
#   - 現在の値と同じ軸は書き込まない（EEPROM の書き換え回数を無駄にしないため）。
#
# 参考: 現在の実測値は docs/servo-registers.md。90deg = 1024, 180deg = 2048, 270deg = 3072。

baud: 1000000

buses:
  - port: /dev/feetech_left
    servos:
      # ID: [下限, 上限]
      1:  [1000, 3100]
      2:  [1800, 3100]
      3:  [0, 0]
      4:  [1900, 3100]
      5:  [1000, 2900]
      6:  [1000, 3100]
      # ID7 は欠番
      8:  [1000, 3000]
      9:  [1050, 3100]
      10: [1000, 3100]

  - port: /dev/feetech_right
    servos:
      1:  [1100, 3200]
      2:  [1000, 2100]
      3:  [0, 0]
      4:  [850, 2050]
      5:  [1150, 3150]
      6:  [900, 3050]
      # 右半身のみ ID7 がある（左は欠番）。可動域が決まったら書き換える
      7:  [950, 3050]
      8:  [1050, 3100]
      9:  [950, 3000]
      10: [950, 3050]
