# opponent_detector のパラメータ。
#
# docs/opponent_detection.pdf §11 の分け方をそのまま使う。
#
#   body.*   機体から決まる … 起動時に固定。ros2 param set では変えられない
#   match.*  競技から決まる … 規定の寸法から取る。bag の数字から取らない (§8.3)
#   tune.*   実装から決まる … depth のノイズと計算量から決まる。実測で追い込む
#
# 既定値は roboone_perception/detect/params.py にあり、ここに書くのは
# 「この機体での選択」だけにする。値の意味と根拠は params.py の注記を見ること。
/**:
  ros__parameters:

    # ---- 機体から決まる ------------------------------------------------
    body:
      # リング面からカメラ原点までの高さ。高さヒストグラムの窓の中心になるので、
      # ここがずれると窓が場外の床を掴む方向にずれる。実測して入れること。
      # 2026-09-23 実測 365 mm (床から depth の光学中心 = カメラ自身から見て左の IR
      # レンズ まで。ホーム姿勢で立たせた状態)。テストランの画面の「カメラ高さ 実測」
      # がこの値の答え合わせになる (docs/相手機の認識.md §9)。
      # 立位を変えた (home_pose.yaml の height) ら測り直すこと
      cam_height: 0.365
      # 光軸の俯角。**カメラは胴体に水平付け** (2026-09-20 決定)。姿勢の初期値と、
      # 種の窓の位置 (tune.seed_auto) に使う。以降の傾きは面法線が毎フレーム決める
      cam_pitch_deg: 0.0
      # !! 未実測 !! 骨盤中心 (Σ_B 原点) から depth の光学中心まで。前・左が正 [m]。
      # /opponent を機体座標に直すのに使う
      cam_offset_x: 0.0
      cam_offset_y: 0.0

    # ---- 競技から決まる ------------------------------------------------
    # 第 44 回競技規則から (docs/相手機の認識.md §4)。幅の上限は表 2「3 kg 以下級の
    # 腕は軸から 30 cm」から、両腕を広げた 0.8 m。桜木町の bag のミニロボット
    # （上端 26.8 cm・幅 23.2 cm）は「この値でミニロボも取れるか」の確認にだけ使う。
    #
    # ★当日ここだけ見る★ 高さの 3 つの境界で、塊を 4 つに割る。**絶対値** [m] で、
    # クラスタ上端 z_top（リング面から測った、その塊の一番高い点）と直接くらべる。
    #
    #     z_top < obj_top_min       … 床のゴミ・ケーブル。相手にしない
    #     〜 fallen_top_max         … 転倒した二足機。近寄らず離れる (規則 10.2(b)(i))
    #     〜 robot_top_max          … 立っている二足機。攻撃の対象
    #     robot_top_max 〜          … 人・人の腕・什器。相手にしない
    #
    # 動かしたときに何が起きるか:
    #   fallen_top_max を上げる → 立っている小さい機体が「転倒」に化けて、攻めずに
    #     離れ続ける。bag のミニロボットは立位で 0.268 m なので 0.25 が上限の目安
    #   fallen_top_max を下げる → 倒れた相手を「立っている」と見て攻め続ける
    #     （規則 10.2(b)(i) のイエローカード）
    #   robot_top_max を上げる → レフリーの腕やしゃがんだ人を相手として追いかける
    #   robot_top_max を下げる → 背の高い出場機を「人」と見て、相手を丸ごと無視する。
    #     第 44 回規則に身長の上限規定は無いので、この側の余裕は多めに取ってある
    #
    # 境界は 1 フレームごとに効く。実際の転倒の判定には行動層で時間の門
    # (behavior.yaml の fallen_time / stand_time) が入る。
    match:
      obj_top_min: 0.10
      fallen_top_max: 0.25
      robot_top_max: 0.60
      obj_width_min: 0.05
      obj_width_max: 0.80
      range_max: 3.0

    # ---- 実装から決まる ------------------------------------------------
    tune:
      # 間引き幅。§4 表 2 より d=2 で検出率は変わらず 3.3 倍速い。
      # Pi 5 が 33 ms に収まらないときはまず 3 にする（§10 の 1 番目の手）
      stride: 2
      # 占有グリッドのセル幅 [m]。**判定の解像度そのもの**で、俯瞰図の粗さもこれ。
      # リング面の連結・崖・塊の足もとは全部この格子の上で決まる。
      # 小さくすると細かくなるが、セル数が 1/cell^2 で増える
      # (Pi 5・合成シーンの全体時間: 0.05 -> 13.6 ms / 0.025 -> 19.4 / 0.02 -> 23.3。
      #  30Hz の予算は 33 ms で、ノード経由だとこれに 7 ms ほど乗る)
      # ★セル数で効く量はここに書かない。長さ [m] と広さ [m^2] で持っていて、
      #   params.py がこの cell から換算する。だから cell だけ変えてよい
      # ★2026-09-23 実機で測り直して 0.025 -> 0.05 に戻した。実機のシーンは
      #   合成シーンの約 2 倍重く、0.025 では 1 フレーム 44 ms かかって 30 Hz の
      #   予算 33 ms に入らなかった (22 Hz まで落ちた)。**細かくしたいなら周期が
      #   落ちるのを承知で実行時に下げる**:
      #     ros2 param set /opponent_detector tune.cell 0.025   # 実機で約 44 ms
      #   画面の「処理 ms」と「周期 Hz」を見ながら決めること
      cell: 0.05
      # 点を集める高さの帯の上限 [m]。match.robot_top_max より**高く**取ること。
      # ここで切ると z_top がこの高さで飽和するので、robot_top_max と同じにすると
      # 「人」と「立っている機体」が区別できなくなる。1.20 は水平付け・カメラ高さ
      # 0.365 m で、距離 1.51 m に立つ人の見える上端にあたる
      obj_h_hi: 1.20
      floor_band: 0.030
      # リング面の高さヒストグラムの窓。段差 34 cm に対して場外の床が入らない幅
      hist_window: 0.25
      # 種の窓を、床が写り始める距離 (水平付け・高さ 0.365 m で 0.66 m) の先へ自動で置く
      seed_auto: true
      # リングの内側 = 見えたリング面と自機の凸包。足元の死角に入った相手を落とさない
      ring_hull: true
      # 相手の影で分断された床を、影をまたいでつなぐ長さ [m]
      shadow_bridge: 1.5
      # 外から差し込む塊 (レフリーの腕など) の棄却。縁の外 0.50 m の帯で、内側の塊と
      # つながる「確かに外の物」が 0.010 m^2 以上あれば相手にしない。0 で無効
      intrude_band: 0.50      # [m]
      intrude_min_area: 0.010 # [m^2]
      # 「外の物」とみなすセルの最小点数。ここだけはセルの大きさで割らない
      # (飛び画素は面積ではなく点の数の話)。cell を小さくしたら下げること
      intrude_cell_points: 2
      # 塊を切るボクセルの高さ [m]。**水平の cell とは別に決める** (2026-09-23)。
      # 水平は計算量で決まり (1/cell^2 でセルが増える)、高さはノイズの分離で決まる。
      # 25 mm にしてあるのは、相手の真上 25 mm より近くに浮いた点だけを同じ塊に
      # 入れるため。cell を 0.05 に戻しても、ここは下げたままでよい (+0.7 ms 程度)。
      # 塊は真上から見た 2 次元ではなく、高さも入れた 26 近傍でつなぐ (2026-09-23)。
      # 相手の真上に浮いたノイズを同じ塊に入れて上端を跳ね上げないため。
      # 小さくすると相手が割れ、大きくすると浮いたノイズを拾い直す
      # (深度の点の間隔は距離 3 m・stride=2 で 15 mm なので 25 mm はまだ余裕がある)
      cell_z: 0.025
      # 塊の足もとのうち、真上に別の塊が乗っている広さ [m^2] がこれ以上あれば
      # 相手にしない。0 で無効。レフリーの腕が相手の上を通っている間は、そこへ
      # 踏み込むべきではない。浮いたノイズ数ボクセルでは立たない広さにすること
      overhead_min_area: 0.010

    # ---- 基準姿勢の取り直し --------------------------------------------
    # 鉛直の推定が 12 deg より外れると自力で戻れない (脱力した姿勢から立ち上がった
    # あと・転倒のあと)。/detector/reset_attitude (std_msgs/Empty) か、/autonomy が
    # true になった瞬間に、静止中の加速度の平均から置き直す。
    reset_on_autonomy: true
    reset_timeout: 5.0          # [s] 静止を待つ上限
    reset_still_gyro: 0.15      # [rad/s] 直近 0.4 s の角速度の最大がこれ未満なら静止
    reset_still_accel: 0.6      # [m/s^2] 加速度の平均の大きさと重力の差がこれ未満

    # ---- ノードの入出力 ------------------------------------------------
    depth_topic: /camera/depth/image_rect_raw
    camera_info_topic: /camera/depth/camera_info
    imu_topic: /camera/imu
    # realsense2_camera は画像を RELIABLE で出す。取り違えると 1 枚も来ない
    depth_qos: reliable
    frame_id: base_link
