# opponent_detector のパラメータ。
#
# docs/opponent_detection.pdf §11 の分け方をそのまま使う。
#
#   body.*   機体から決まる … 起動時に固定。ros2 param set では変えられない
#   match.*  競技から決まる … 規定の寸法から取る。bag の数字から取らない (§8.3)
#   tune.*   実装から決まる … depth のノイズと計算量から決まる。実測で追い込む
#
# 既定値は roboone_perception/detect/params.py にあり、ここに書くのは
# 「この機体での選択」だけにする。値の意味と根拠は params.py の注記を見ること。
/**:
  ros__parameters:

    # ---- 機体から決まる ------------------------------------------------
    body:
      # リング面からカメラ原点までの高さ。高さヒストグラムの窓の中心になるので、
      # ここがずれると窓が場外の床を掴む方向にずれる。実測して入れること。
      # !! 未実測 !! 測るのは「床から、depth の光学中心 (カメラ自身から見て左の IR
      # レンズ) まで」。ホーム姿勢で立たせた状態で。テストランの画面の
      # 「カメラ高さ 実測」がこの値の答え合わせになる (docs/相手機の認識.md §9)
      cam_height: 0.40
      # 光軸の俯角。**カメラは胴体に水平付け** (2026-09-20 決定)。姿勢の初期値と、
      # 種の窓の位置 (tune.seed_auto) に使う。以降の傾きは面法線が毎フレーム決める
      cam_pitch_deg: 0.0
      # !! 未実測 !! 骨盤中心 (Σ_B 原点) から depth の光学中心まで。前・左が正 [m]。
      # /opponent を機体座標に直すのに使う
      cam_offset_x: 0.0
      cam_offset_y: 0.0

    # ---- 競技から決まる ------------------------------------------------
    # 第 44 回競技規則から (docs/相手機の認識.md §4)。身長の上限規定は無いので
    # obj_top_max は据え置き。幅の上限は表 2「3 kg 以下級の腕は軸から 30 cm」から、
    # 両腕を広げた 0.8 m。桜木町の bag のミニロボット（上端 26.8 cm・幅 23.2 cm）は
    # 「この値でミニロボも取れるか」の確認にだけ使う。
    match:
      obj_top_min: 0.10
      obj_top_max: 0.70
      obj_width_min: 0.05
      obj_width_max: 0.80
      range_max: 3.0

    # ---- 実装から決まる ------------------------------------------------
    tune:
      # 間引き幅。§4 表 2 より d=2 で検出率は変わらず 3.3 倍速い。
      # Pi 5 が 33 ms に収まらないときはまず 3 にする（§10 の 1 番目の手）
      stride: 2
      cell: 0.05
      floor_band: 0.030
      # リング面の高さヒストグラムの窓。段差 34 cm に対して場外の床が入らない幅
      hist_window: 0.25
      # 種の窓を、床が写り始める距離 (水平付け・高さ 0.40 m で 0.72 m) の先へ自動で置く
      seed_auto: true
      # リングの内側 = 見えたリング面と自機の凸包。足元の死角に入った相手を落とさない
      ring_hull: true
      # 相手の影で分断された床を、影をまたいでつなぐ長さ [m]
      shadow_bridge: 1.5
      # 外から差し込む塊 (レフリーの腕など) の棄却。縁の外 10 セル (50 cm) の帯で、
      # 内側の塊とつながる「確かに外の物」が 4 セル以上あれば相手にしない。0 で無効
      intrude_band_cells: 10
      intrude_min_cells: 4
      intrude_cell_points: 3

    # ---- 基準姿勢の取り直し --------------------------------------------
    # 鉛直の推定が 12 deg より外れると自力で戻れない (脱力した姿勢から立ち上がった
    # あと・転倒のあと)。/detector/reset_attitude (std_msgs/Empty) か、/autonomy が
    # true になった瞬間に、静止中の加速度の平均から置き直す。
    reset_on_autonomy: true
    reset_timeout: 5.0          # [s] 静止を待つ上限
    reset_still_gyro: 0.15      # [rad/s] 直近 0.4 s の角速度の最大がこれ未満なら静止
    reset_still_accel: 0.6      # [m/s^2] 加速度の平均の大きさと重力の差がこれ未満

    # ---- ノードの入出力 ------------------------------------------------
    depth_topic: /camera/depth/image_rect_raw
    camera_info_topic: /camera/depth/camera_info
    imu_topic: /camera/imu
    # realsense2_camera は画像を RELIABLE で出す。取り違えると 1 枚も来ない
    depth_qos: reliable
    frame_id: base_link
