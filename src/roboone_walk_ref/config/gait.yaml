# 歩行の静的設定 (docs/ros2_walk_implementation.pdf 表 2 のうち計画に効く項目)。
# 値の意味と単位は roboone_walk_ref/walk_core/params.py を参照。
# ここに無いキーを足すと GaitParams.from_yaml() が KeyError で落ちる (打ち間違い対策)。

z_c: 0.280              # [m] 重心高さ。home_pose.yaml の foot.height (mm) と同じ値にする。
                         # **2026-09-20 に 0.261 -> 0.280。**下の foot_spacing を股の真下
                         # (178.6mm) へ広げるため。理由と限界の表は home_pose.yaml の
                         # foot.height の注記 (上げすぎると支持脚が伸び切る)。
                         # ω = sqrt(g/z_c) が 6.13 -> 5.92 に下がるので、1 歩の増幅
                         # e^{ωT} (T = ds_time + t_step = 0.90s) も 249 -> 206 になる。
                         # 261 mm = 脚の傾き 30 deg 相当。motion ノードが起動時に
                         # 突き合わせて、食い違っていれば警告する
gravity: 9.81
t_step: 0.35             # [s] 単脚支持の長さ (両足支持は下の ds_time で別に持つ)。
                         # **2026-09-20 に 0.60 -> 0.45。**実機の足踏みで、骨盤が支持足の
                         # ほぼ真上まで寄り (足幅の半分の 85%。静歩行は 100%)、支持脚の外側へ
                         # 倒れたため。下の「横の寄り」の表で foot_spacing / ds_time と一緒に
                         # 動かして 61% にした。以下は 0.60 にした 2026-08-29 の注記:
                         # 0.60 は**静歩行寄りに倒した値**だった。
                         # T を伸ばすと LIPM の重心が支持足の真上に寄る = 静歩行に
                         # 漸近する。単脚支持の中央で重心が支持足から内側へどれだけ
                         # 残るかは (W/2) sech(ωT/2):
                         #   T=0.30 -> 61.4mm   T=0.60 -> 27.7mm   T=1.00 -> 8.3mm
                         # 引き換えに e^{ωT} が 6.3 -> 39.6 に増える。純 FF なので
                         # 計画と実機のずれは 1 歩で 39.6 倍に増幅される。**推定 ξ を
                         # 入れずにこれ以上伸ばさないこと。**
                         # なお T を短くする側の下限は swing_height を出せるサーボ
                         # 速度で決まる (上昇区間は 0.45T しかない。膝サーボは 50mm の
                         # 持ち上げに 15.4 deg 動き、ピークは 1.875 x 0.269rad/(0.45T)。
                         # T=0.60 で 1.87 rad/s = 無負荷 4.7 の 40%、T=0.25 では 95% で
                         # 追従せず足が上がりきらない)。
foot_spacing: 0.130     # [m] **計画上の**左右の足間隔 W。横の重心経路 (振り幅) はこの値で決まる。
                         # **実機の足の位置は home_pose.yaml の foot.y (今は ±70mm = 2026-09-14 の
                         # 実機校正の足間隔 140mm) で決まり、この値では動かない。** motion ノードが
                         # 計画の立位 (±W/2) をホーム姿勢の足へ平行移動する (2026-09-18 までは
                         # motion_node.yaml の stance_y_offset で別に合わせていた)。
                         #
                         # ★**横の寄り (2026-09-20)。実機の足 ±89.3 より狭い 155mm にしてある。**
                         # 実機の足踏みで支持脚の外側へ倒れた。計画を実機と同じ 178.6 に取ると
                         # 骨盤が支持足の中心の 13.8mm 手前 (足幅の半分の 85%) まで寄り、単脚支持に
                         # 入る瞬間の ξ (重心 + 速度/ω) の余裕が 2.4mm しか無かった。純 FF なので
                         # 実機の勢いがそれだけ大きいと外へ倒れ続ける。**外への倒れは次の一歩で
                         # 受けられない** (足を外へは出せない) ので、計画は内寄りに取っておく。
                         #
                         # 寄りを決めるつまみは 3 つ (足踏みの定常。実機の足 ±89.3 / z_c 280):
                         #
                         #   W      ds    t_step  寄り  骨盤→支持足  横速   ξ余裕  足上げ速  増幅
                         #   178.6  0.30  0.60    85%    13.8mm    0.35    2.4mm   0.24    206  (倒れた)
                         #   160    0.30  0.60    76%    21.7mm    0.31   11.4mm   0.24    206
                         #   178.6  0.00  0.60    67%    29.0mm    0.50    5.0mm   0.24     35
                         #   178.6  0.30  0.40    72%    24.8mm    0.33    7.7mm   0.36     63
                         #   155    0.20  0.45    61%    35.0mm    0.33   18.0mm   0.32     47  ★今
                         #
                         #   * W (ここ)  横振りだけを比例で縮める。時間も足上げの速さも変わらない。
                         #     狭めるほど計画の ZMP が実機の足の中心より内側へ寄り (今 11.8mm。
                         #     足裏の半幅は 37mm)、支持足首のロールに常時トルクが掛かる
                         #   * ds_time   短くすると寄りは減るが**横の最高速が上がる**。ξ の余裕は増えない
                         #   * t_step    短くすると寄りも増幅も減るが、足上げが速くなる
                         #     (9/17 までの 50mm / 0.60s が 0.35 m/s。それ以下に収めてある)
                         # まだ外へ倒れるなら W を 150 -> 145、遊脚側へ倒れ始めたら 160 へ戻す。
                         # 取り直し: docs/commands.md の「横の寄り」の節。
                         #
                         # home_pose.yaml の foot.y 89.3 (実機の足 = 股の真下) と height 280 は別の話で、
                         # そちらは変えていない。
                         # 2026-09-19 は 140mm (実機の足 ±70 と同じ)。それ以前は計画だけ
                         # 170 に広げていたが、ds_time 0.3 で両足支持の間に骨盤が支持足へ
                         # 寄るようになったので、計画だけ広げる工夫は要らなくなった。
                         #
                         # 経緯: ZMP を歩の間ずっと支持足に固定していた頃 (ds_time = 0)、
                         # W=140 では単脚支持の中央でも骨盤が支持足の中心から 15mm 内側で
                         # 折り返し、実機は毎歩**遊脚側へ**倒れて振れが育った
                         # (rosbag: 1 歩ごとに 5→12→14→25 deg。安定化ゲイン 0 でも同じ)。
                         # そこで 2026-09-17 に計画だけ 170 へ広げていた。実機の重心は計画ほど
                         # 動かない (脚の質量・サーボのたわみ) ので、計画で多めに振る理屈。
                         # 両足支持でも遊脚側へ倒れるなら、また上げる (foot.y は触らない)。
                         #
                         #   W (片側で実機より)  骨盤→支持足中心  横の最高速  届かない時刻
                         #   ds_time = 0 (2026-09-18 まで):
                         #   140 (+0)             15.2mm          0.41 m/s   なし
                         #   160 (+10)             7.4mm          0.47 m/s   なし
                         #   170 (+15)             3.5mm          0.50 m/s   全速前進→後ろ斜めの切り返し、
                         #                                                   斜め歩きからの停止で 40〜60ms
                         #   180 (+20)             0.0mm          0.53 m/s   全速前進で遊脚の頂点
                         #   ds_time = 0.3 (今。走査は下の ds_time の表):
                         #   140 (+0)              9.9mm          0.28 m/s   なし
                         #   150 (+5)              5.7mm          0.30 m/s   10ms
                         # (T=0.60・実機の足 ±70mm。leg_service の IK + 機構層で確認。
                         #  home_pose.yaml の foot.y を変えるとこの表は動く。±89.3 では
                         #  足上げ 50mm の遊脚がどの W でも届かなくなる。2026-09-18)

swing_height: 0.032      # [m] 遊脚の頂点高さ。20mm では実機で両足とも床を擦って
                         # その場でもじもじするだけだったので上げた (2026-08-29)。
                         # 上げると連動して td_speed_max と t_step の下限が動く。
                         # 50 → 40mm (2026-09-19)、**40 → 35mm (2026-09-20)**。
                         # 足首パラレルリンクの横の到達は足裏の高さで決まる (足を上げるほど
                         # 横に届かない。表は home_pose.yaml の foot.height の注記)。
                         # ds_time 0.3 で骨盤が支持足の上に長く留まるぶん遊脚が横へ大きく
                         # 開くので、足幅を広げるたびに足上げを下げる必要がある。
                         # 今の足幅 178.6mm / z_c 280 では 40mm で 640ms 届かず、35mm で 0ms。
                         # **30mm 以下は床を擦るかが未確認** (20mm は 2026-08-29 に擦った)
swing_lock_phase: 0.70   # 着地点の凍結位相
td_overdrive: 0.000      # [m] 名目床面より下へ突き抜ける量。
                         # **2026-09-19 に 0.004 (4mm) から 0 にした。** 静歩行は
                         # 2026-09-18 に先に 0 にしてある (static_gait.yaml)。
                         # 押し込んだ 4mm は歩の境界の 1 周期 (5ms) で 0 へ戻るので、
                         # その瞬間だけ要求速度が ID1 3562 / ID4 3268 / ID5 5913 step/s に
                         # 跳ねていた (docs/サーボ追従と両足支持_実装計画.md §1.7)。
                         # 距離は小さいが余計な着地衝撃になる。
                         # **押し込みは「床に確実に着ける」ためのものではない。**
                         # 届くかどうかは下の td_speed_max との兼ね合いで決まる。
td_speed_max: 0.20       # [m/s] 着地直前の降下速度上限。
                         # 降下区間は 0.55T なので、swing_height + td_overdrive
                         # (40mm) を 0.55T で割った値より小さいと**足が床に届かない**
                         # まま歩の境界を迎える (以前の 20mm + T=0.40 + 0.10 では
                         # 着地時に +1.6mm 浮いていて overdrive が効いていなかった)。
                         # 40mm / (0.55 x 0.60) = 最低 0.122 必要。整形前の profile の
                         # 最大降下は 0.25 m/s なので、0.20 で頭を抑えられる。

swing_ratio: 1.00        # [-] 遊脚が歩周期 T のうち何割を使うか。1.0 = 従来
                         # (φ=1 ちょうどで着く)。下げるとその手前で着地点に達し、
                         # 残りは両足が着いたまま止まる = 両足支持区間になる。
                         #
                         # ★ZMP は歩の間ずっと支持足に固定されたままなので、ここを
                         #   変えても DCM も b の閉形式も a_max の発散条件も変わらない。
                         #   増えるのは「支持多角形が広い時間」だけで、
                         #   **計画上の重心経路は 1 ミリも変わらない**。重心の動きまで
                         #   静的にしたいなら ZMP を両足間で動かす必要がある
                         #   → それが下の **ds_time**（2026-09-18 に b の導出からやり直した）。
                         #   横振りを減らしたいならこの項目ではなく ds_time を使うこと。
                         #
                         # ★狙った値はそのまま出ない。降下が td_speed_max で飽和する
                         #   ぶん接地が遅れる。起動ログが実測値を出すので、そちらを見る。
                         #
                         # 走査 (当時の値 = swing_height 50mm / td_overdrive 4mm /
                         #       td_speed_max 0.20 / T=0.60。2026-08-29。今の値では動く):
                         #
                         #   swing_ratio  1.00  0.85  0.75  0.66  0.50  0.33
                         #   狙い両足支持   0%   15%   25%   34%   50%  66.7%
                         #   実際の両足支持 3.3% 12.5% 18.3% 23.3% 32.5% 41.7%
                         #
                         # 全域で降下が上限に張り付いているので、実際は必ず狙いより
                         # 小さく出る。2/3 を出すには td_speed_max を ~0.9 m/s まで
                         # 上げることになり、着地衝撃対策を捨てる形になる。
                         # 今の設定で無理なく入るのは 0.75〜0.66 あたり。

ds_time: 0.05             # [s] 両足支持の時間 Td。**2026-09-20 に 0.3 -> 0.2** (上の foot_spacing の
                         # 「横の寄り」の表。t_step 0.45 とひと組)。以下は 0.3 にした 9/19 の注記。
                         # ---
                         # 両足支持の時間 Td。**0 にすると 2026-09-18 までの従来の歩き方
                         # (両足支持なし・ZMP は歩の間ずっと支持足) に完全に戻る。**
                         # 正にすると各歩の頭に Td の両足支持を置き、その間に ZMP を前の支持足
                         # から新しい支持足へ直線で移す (swing_ratio と違い、重心の経路が変わる)。
                         # t_step はその後の単脚支持のまま。1 歩は Td + t_step に伸び、歩幅は
                         # v x t_step のままなので、歩く速さは t_step/(Td + t_step) 倍に落ちる。
                         #
                         # **0.3 を既定にした (2026-09-19)。** 1 歩 0.90s・歩く速さは指令の 67%。
                         # 道連れで foot_spacing 170→140・swing_height 50→40mm を動かしてある
                         # (上の 2 項目を参照。**3 つはひと組。片方だけ戻さないこと**)。
                         # 狙いは §1.8 の「横振りを遅くする」= 骨盤の横の最高速 0.50→0.28 m/s、
                         # 股ロール ID2 と足首 ID5 の要求速度を下げること
                         # (docs/サーボ追従と両足支持_実装計画.md)。
                         #
                         # 走査 (2026-09-18。walk_reach.py。実機の足 ±70mm・T=0.60・
                         # a_max (0.06, 0.03)。足踏み・前後・左右・斜め・切り返しの 9 通り):
                         #
                         #   Td    W    足上げ  骨盤→支持足  横の最高速  届かない   発散
                         #   0    170   50mm     11.0mm     0.50 m/s     70ms      -   (〜9/18)
                         #   0    140   50mm     21.4mm     0.41 m/s      0        -
                         #   0.2  140   40mm     12.5mm     0.32 m/s      0        -
                         #   0.3  140   40mm      9.9mm     0.28 m/s      0        -   ★今
                         #   0.3  150   40mm      5.7mm     0.30 m/s     10ms      -
                         #   0.4  140   30mm      8.1mm     0.25 m/s      0        -
                         #   0.4  140   40mm      8.1mm     0.25 m/s    290ms      -
                         #   0.4  150   30mm      3.7mm     0.26 m/s      0        -
                         #   0.5  140   30mm      6.8mm     0.22 m/s      0      前後・斜め
                         #
                         # (骨盤→支持足 = 足踏みの単脚支持の中央で、骨盤が実機の支持足の中心から
                         #  内側に残る量。横の最高速は足踏みの定常)
                         #
                         # * 両足支持の間に骨盤が支持足へ寄るので、foot_spacing で計画を広げる
                         #   (170) 必要は薄れる。170 のまま Td 0.4 だと骨盤が支持足の外まで振れる
                         # * その代わり骨盤が支持足の上に長く留まり、遊脚が骨盤から横へ大きく開く
                         #   時間が延びる。足上げ 50mm のままだと遊脚の頂点が届かない (Td 0.2 /
                         #   W 140 で 0.5 秒、Td 0.4 / W 140 で 2.6 秒)。swing_height を下げること
                         #   (20mm は床を擦った。2026-08-29)
                         # * Td を延ばすほど、指令の変化を着地点で吸収しきれなくなる (ずらしが
                         #   e^{ωTd}/κ 倍)。a_max (0.06, 0.03) では 0.4 まで。0.5 は全速前進からの
                         #   停止でも計画が発散した。延ばすなら a_max を下げる
                         # * 「後ろへ少し入れてからすぐ前進」は Td 0 / 0.2 / 0.3 でも発散する
                         #   (両足支持と無関係の既知の問題。0.4 では通った)
                         # 取り直し: python3 src/roboone_viz/roboone_viz/walk_reach.py \
                         #   --ds-time 0,0.2,0.3,0.4 --foot-spacing 0.14,0.15 --swing-height 0.05,0.04,0.03

v_max: [0.10, 0.04]      # [m/s] (x, y) 指令の飽和。**T に比例して歩幅が伸びるので、
                         # T を伸ばしたらここを下げないと足先が到達域を出る。**
                         # T=0.60 のまま (0.15, 0.08) だと遊脚頂点の前後が ±49mm に
                         # なり、50mm の高さでの機構到達 (前56/後37) を超える。
                         # (0.10, 0.04) で頂点 ±33mm・遊脚の横 158.6mm (限界 162.3)。
a_max: [0.06, 0.03]      # [m/s^2] 指令のレート制限。純FFでは 1 歩あたりの変化 a·T² が
                         # 着地点クランプに収まる必要がある (上限 (0.11, 0.05)、params.py 参照)。
                         # 上限は T² で効くので、T を倍にすると 1/4 に狭まる。
                         # v_max 0.10 への到達に 1.67s (約 2.8 歩) かかる

step_clamp_x: 0.04       # [m] 着地点の前後許容ずれ
step_clamp_out: 0.045    # [m] 外側
step_clamp_in: 0.020     # [m] 内側 (脚同士の干渉のため狭い)。
                         # **停止準備歩のオフセット b_stop = (W/2)/e^{ωT} より大きく取ること。**
                         # 下回ると準備歩の着地が必ずクランプに当たり、横の残留を
                         # 吸収しきれずに公称より広い立位で止まる。T=0.60 では
                         # b_stop=2.3mm なので余裕がある (T=0.30 では 14.2mm、
                         # T=0.25 では 19.3mm だった)。20mm のままにしてあるのは
                         # a_y の上限が step_clamp_in に比例するため。

start_pushoff_max: 0.15  # [s] 押し出しの最長時間
k_dcm: 1.0               # 踏み出し補正のゲイン (計画値を入れている間は純 FF)
cmd_timeout: 0.5         # [s] 指令途絶で停止に入る (motion ノード側で使う)
loop_hz: 200.0
