# 静歩行の静的設定。motion ノードが walk_mode:=static のときに読む (gait.yaml は読まない)。
# 値の意味と単位は roboone_walk_ref/static_walk/params.py を参照。
# ここに無いキーを足すと StaticGaitParams.from_yaml() が KeyError で落ちる (打ち間違い対策)。
#
# 歩き方: 両足支持で重心を支持足の上へ移し (SHIFT)、止めたまま反対の足を振り出す (SWING)。
# 仕様は static_walk/engine.py の docstring。
#
# ★調整はこのファイルで行う。コードの既定値 (params.py / static_walk_engine.hpp /
#   staticwalk.js。3 つは照合ツールで一致を見る) とは違っていてよい。
#
# ★2026-09-18: 動きを見るため、**時間に関わる値を全部 3 倍 (速さ 1/3)** にしてある。
#   重心移動 (zmp_tol 1/9 で 3 倍・t_shift_min)・振り出し (t_swing)・足を下ろす速さ
#   (td_speed_max)・指令の立ち上がり (a_max)。歩幅は同じ。1 歩 6.4s・0.0094 m/s。
#   元 (コードの既定と同じ) は zmp_tol 0.010 / t_shift_min 0.3 / t_swing 0.6 /
#   td_speed_max 0.20 / a_max [0.06, 0.03] (1 歩 2.13s・0.028 m/s)。

z_c: 0.261               # [m] 重心高さ。gait.yaml と同じ値にする (home_pose.yaml の foot.height)
gravity: 9.81
foot_spacing: 0.140      # [m] 計画上の足間隔。**home_pose.yaml の foot.y (今は 70mm) の 2 倍と
                         # 揃えること** (140mm = 2026-09-14 の実機校正)。motion ノードは計画の
                         # 立位 (±W/2) をホーム姿勢の足へ平行移動するので、実機の足の位置は
                         # foot.y だけで決まる。ここがずれていると、その差だけ振り出し中の
                         # 重心が支持足の中心から横へずれる (W が広いと外側、狭いと内側)。
                         # 動歩行は計画を実機より広く取って横振りを増やしているが、静歩行で
                         # 重心を横へずらすのは下の com_offset_y で行う (食い違いは起動時に言う)

sole_length: 0.118       # [m] 足裏の前後 (2026-09-17 実測)。IK の目標点が中心の長方形とみなす
sole_width: 0.074        # [m] 足裏の左右 (同上)

# --- 重心移動 (SHIFT) ---------------------------------------------------------
zmp_tol: 0.00111         # [m] 重心の加速度で ZMP が重心の真下からずれてよい量。
                         # 重心移動の時間は 1/sqrt(zmp_tol) に比例する。今は 10mm の 1/9 で時間 3 倍
                         # (足間隔 140mm の移動に 4.40s、中点 -> 足の 70mm に 3.11s。
                         # 10mm なら 1.47s / 1.04s)。
                         # 大きくすると速く歩けるが、ZMP の静的余裕 (足裏の縁まで) が減る。
                         # 余裕は計画に無い誤差 (実機の重心は骨盤と違う・サーボの遅れと膝の
                         # しなり・遊脚の反動) を吸う分。走査 (2026-09-18。前後・左右・斜め・
                         # 切り返しの全時刻の最小。振り出し 0.6s・歩幅 60mm):
                         #
                         #   zmp_tol           5mm    10mm   15mm   20mm   30mm
                         #   重心移動 (140mm)  2.07s  1.47s  1.20s  1.04s  0.85s
                         #   ZMP の静的余裕    33.8   29.5   24.9   20.2   10.6 mm
                         #   重心の最大加速度  0.19   0.38   0.56   0.75   1.13 m/s^2
                         #
                         # 動歩行は支持足の切り替えで横に約 3.2 m/s^2 かかっているので、
                         # 30mm でもそれより穏やか。10mm は 5mm (当初) から実機前に上げた値。
                         # 実機で安定していれば 15mm (余裕 24.9mm) が次の候補
t_shift_min: 0.9         # [s] 重心移動の最短時間 (速さ 1/3 に合わせて 0.3 の 3 倍)
com_offset_y: 0.0        # [m] 振り出し中の重心を支持足の中心から横へずらす量。+ で外側。
                         # 実機は遊脚を上げると重心が遊脚側 (内側) へ寄るので、倒れるなら + へ。
                         # ただし + にするほど遊脚が骨盤から横へ離れて足首リンクが届かなくなる。
                         # 下の swing_height の表を見ること。静的余裕は 37mm - |これ|
                         #
                         # 2026-09-18: 一度 -20mm (支持足の中心の 20mm 手前で止める) を試したが、
                         # ユーザの指示で 0 (真上) に戻した。-20mm のときは静的余裕 17mm・
                         # 足と足の間の重心移動 100mm (3.72s)・1 歩 5.82s で、足上げ 25 / 30mm とも
                         # 全時刻届いていた (-15 / -25mm も同じ)。
                         # 実機が遊脚側へ倒れるなら + (外側) が向き。ただし + は遊脚が届きにくくなる
                         # ので、下の swing_height の表と一緒に決めること

# --- 遊脚 (SWING) -------------------------------------------------------------
t_swing: 1.8             # [s] 振り出しの時間。今は 0.6 (動歩行 T=0.60 の遊脚と同じ速さ) の 3 倍。
                         # ZMP の余裕には効かない (計画は遊脚の反動を見ていない) が、
                         # 縮めるほど反動が増える。0.8 -> 0.6 で 1 歩 0.2s 短くなる
swing_height: 0.03      # [m] 足上げの頂点高さ。**動歩行の 50mm より低い。**
                         # 重心を支持足の上に置くので、遊脚は骨盤から横へ 140mm 以上開いた
                         # まま上がり、足首パラレルリンクが届かなくなる。後ろ寄り
                         # (x = -35〜-55mm) で上げている位相が最初に届かなくなる。
                         #
                         # leg_service (IK + 機構層) での走査 (2026-09-18。このファイルの値 = 時間 3 倍・
                         # v_max (0.10, 0.04)、前後・左右・斜め 4 方向・前後と左右の切り返し・
                         # 前進→斜めの 11 通り。指令の時間は 1 歩の長さに比例させてある。
                         # 数字は届かない時刻の数。0 = 全時刻届く):
                         #
                         #   h \ com_offset_y   +10mm   +5mm    0mm   -5mm  -10mm
                         #   35mm                 438    229     81     16      0
                         #   30mm                 196     74     11      0      0
                         #   25mm                  46      6      0      0      0
                         #   20mm                   0      0      0      0      0
                         #
                         # 同じ幾何でも時間の値を変えると数字が少し動く (指令の立ち上がり中の
                         # 歩幅の並びが変わるため)。設定を変えたら取り直すこと。
                         # motion ノードも起動時に同じ 11 通りを回して、届かない時刻があれば
                         # エラーを出す (checkStaticWalkEnvelope)
                         #
                         # 取り直し: python3 src/roboone_viz/roboone_viz/static_reach.py \
                         #   --swing-height 0.035,0.03,0.025,0.02 --com-offset 0.01,0.005,0,-0.005,-0.01
                         #
                         # 50mm / 40mm (オフセット 0) はまっすぐ前進するだけで届かない。
                         # 動歩行は 20mm で床を擦った (2026-08-29) ので、20mm は避けたい。
                         # com_offset_y を + にするなら、この表で swing_height を下げること
td_overdrive: 0.000        # [m] 名目床面より下へ突き抜ける量。
                         # **2026-09-18 に 0.004 -> 0 (押し込みを撤廃。ユーザ指示)。**
                         # 支持足の足裏より下を狙う指令で、遊脚が床を蹴る原因の 1 つだった。
                         # 0 にすると遊脚の z は振り出しの終わりにちょうど 0 に着く
                         # (接地の位相 0.847 -> 1.000)。着地の周期に 4mm 戻る段差も消える。
                         # ★遊脚が床に届くかの門 (checkStaticGait) は通る。実機では
                         #   サーボの遅れと関節の外のたわみのぶん、指令より早く床に当たる
td_speed_max: 0.05     # [m/s] 着地直前の降下速度上限。今は 0.20 の 1/3 (足を下ろす速さも 1/3)。
                         # (swing_height + td_overdrive) / (0.55 x t_swing) = 0.025 以上が要る
                         # (t_swing 0.6 なら 0.076)。t_swing と同じ比で動かすと接地の位相が変わらない

# --- 指令の解釈 ---------------------------------------------------------------
stride_time: 0.60        # [s] 歩幅 = v x stride_time。gait.yaml の t_step と揃えてあるので、
                         # 同じ指令で動歩行と同じ足跡になる (全速前進で 1 歩 6.4s・0.0094 m/s。
                         # 時間を 3 倍にする前は 2.13s・0.028 m/s)
v_max: [0.10, 0.04]      # [m/s] 歩幅の上限 = (60, 24) mm。gait.yaml と同じ
a_max: [0.02, 0.01]      # [m/s^2] 指令のレート制限。今は gait.yaml (0.06, 0.03) の 1/3 で、
                         # 全速までの歩数が時間 3 倍の前と同じになる (静歩行には純 FF の発散条件は無い)

v_start_eps: 0.005       # [m/s] これ以上で歩き始める
v_stop_eps: 0.010        # [m/s] 歩の境界でこれ未満なら足を揃えて止まる
loop_hz: 200.0
