# ホームポジション（立位・歩行の基準姿勢）。2026-08-28 定義。
#
# ===========================================================================
# 足裏の位置姿勢で定義する。関節角は IK が決める。
# ===========================================================================
# 狙いは「胴体が直立・足裏が水平・骨盤が所定の高さ」であって、そこに至る関節角は
# IK が出せばよい。以前は関節角（股ピッチ -20 / 膝 40 / 足首 -20）で書いていたが、
# やめた。理由は 3 つ:
#
#   * 「大腿と下腿を同じだけ傾ける」＝「膝 = 2 x 股ピッチ」という手計算の関係を
#     人間が保守することになる。脚の寸法が変わればこの関係も崩れる
#   * 関節角には AXIS_FLIP（サーボの回転方向）が絡み、**左右で同じ数値が同じ姿勢に
#     ならない**。足裏の位置姿勢なら左右の鏡像は y の符号を変えるだけで済む
#   * モーション（roboone_motion/config/motions.yaml）も足裏の (p, R) で書く。
#     同じ土俵に乗るので、ティーチした姿勢をそのままホームにもできる
#
# 「脚を何度曲げるか」は結果であって指定値ではない。height を決めれば IK が決める。
#
# 単位: 位置 mm / 角度 deg。座標系 Σ_B（x 前・y 左・z 上、原点 = 骨盤 = 股 3 軸の高さ）

# ===========================================================================
# 胴体の前傾 [deg]。+ で前へ倒れる
# ===========================================================================
# **股ピッチ（ID1）に -body_pitch を足すのと厳密に等価。** 股ピッチは脚の最も近位の
# 軸なので、そこに一定量を足すと遠位の連鎖がまるごと回る。つまり
#
#   * 膝・足首の関節角は **1 度も変わらない**。足首ピッチ θ5 の余裕を食わない
#   * 足裏は床に水平のまま。骨盤（股軸）の位置も動かない。胴体が股まわりに回るだけ
#
# 下の foot.rpy の pitch とは**別の操作**。あちらは足裏の位置を固定したまま姿勢だけ
# 回すので、その差を足首が全部吸収する（-10 deg で AnkleUnreachable に当たったのは
# これが理由で、前傾そのものが無理だったわけではない）。両方に値を入れると
# 効果は足し合わさる。**前傾させたいだけならこちらを使い、foot.rpy は 0 に戻す。**
#
# 効く範囲: ホーム姿勢・歩行・キーフレームモーションの全部。walk_core も
# motions.yaml も「骨盤が直立している前提」で書かれたままで、変換は motion ノードの
# サーボ境界 1 か所（writeTargets / measuredPose）でだけ掛かる。
#
# 限界: 股ピッチの可動域（leg_config.hpp の JOINT_LIMIT ±90 deg）から、立位で
# 使っているぶんを引いた残り。入れすぎると起動時の到達域チェックが ERROR を出す。
# ★下の走査（2026-08-29）は JOINT_LIMIT が ±60 deg だったときのもので、
#   「足首ではなく股ピッチが先に尽きる」という結論もその前提。2026-09-15 に
#   ±90 へ広げたので、**どちらが先に尽きるかは取り直すまで分からない**。
# 確かめ方（実機不要・バスを開かない）:
#
#   ros2 run roboone_motion motion_node --ros-args -p dry_run:=true \
#     -p allow_torque:=false -p home_pose_yaml:=<このファイルの絶対パス>
#
# 走査（height 261 / x -20 / foot.rpy 0 のとき。2026-08-29）:
#
#     body_pitch    0    8   10   12   13   14   20    (3=design 2=mech 1=届かない)
#                   2    2    2    2    2    1    1
#
# 0 と 13 で到達域の判定も最悪点（R脚 p=[-40.0, -74.3, -261.0]）も**同一**。
# 足首を食わないので、限界を決めているのは股ピッチの窓のほうである。
# ★height / x / foot.rpy を変えたらこの表は動く。取り直すこと。
#
# 剛体回転であることの検算（leg_service。ψ=8 deg のとき）:
#
#   printf "ikpose R -20 -89.3 -261 0 0 0\n
#           ikpose R 16.518818 -89.3 -261.243436 0 -8 0\n" \
#     | ./build/roboone_kinematics/leg_service
#
#   股ピッチ -25.847883 -> -33.847880（差 -8.000000 deg ちょうど）
#   膝 59.3107 / 足首 θ5(ピッチ) -33.4628 / θ6(ロール) 0 は一致（差 1e-5 deg 未満）
#   足首クランク q=[22.9388, 25.4287]・余裕 [63.44, 97.86] は完全に同一
#
# ★motion_teach で捕まえた姿勢は実機そのまま（前傾込み）で出る。body_pitch を
#   入れた状態でティーチした行をそのまま motions.yaml へ貼ると、再生時にもう一度
#   前傾が掛かって二重に傾く。ティーチするときは一度 0 に戻すこと。
body_pitch: 0.0

foot:
  # [mm] 骨盤から足裏まで。**この値がそのまま LIPM の z_c になる。**
  # gait.yaml の z_c（m 単位）と一致させること。合っていないと motion が起動時に警告する。
  #
  # 伸び切りは 299.945 mm（leg_config.hpp の L3+L4+L5+L6）。低くするほど脚を曲げるので
  #   * 足首ピッチ θ5 を食う（平屈伸なら θ5 ≒ -(脚の傾き)）
  #   * 膝のトルクと発熱が増える
  # 逆に高くしすぎると膝が伸び切って IK の特異点に近づく。
  #
  # 参考（脚の傾き -> 高さ）: 30 deg -> 260.9 / 20 deg -> 282.4 / 15 deg -> 290.0
  #
  # 261 = 脚の傾き 30 deg 相当。重心を下げるため 282 から戻した（2026-08-28）。
  # このとき（x -20 / pitch -10 込みで）股ピッチ -25.4 / 膝の曲げ 59.1 /
  # 足首ピッチ θ5 -43.7 deg。θ5 の下限（エンベロープ）は -55 なので余裕 11.3 deg。
  # ★歩行で指令する足裏はロール 0 固定（rpy の roll が 0 なので θ6 = 0）なので、
  #   歩く分にはこの余裕で足りる。手で脚をひねってロールを入れると
  #   （ロール 15 deg で下限 -34.5）足りなくなる。
  height: 261.0

  # [mm] 前後。+ が前（足裏が骨盤より前に出る）。
  # ★後傾するときはここを **負** にする（足より骨盤を前に出す = 重心が前へ寄る）。
  x: 0.0

  # [mm] 左右の半間隔。leg_config.hpp の HIP_Y（89.3）と同じなら足は股の真下に来る。
  # gait.yaml の foot_spacing（= 2 x この値 / 1000）と揃えること。
  y: 89.3

  # [deg] 足裏の姿勢 (roll, pitch, yaw)。0, 0, 0 が水平。
  # 左右には鏡像で入る（roll と yaw は符号が反転し、pitch は左右同じ）。
  #
  # **この姿勢は歩行中もそのまま使われる**（walk_core は平行移動しか作らないので、
  # 遊脚・支持脚とも足裏の向きはここで決まる）。立位と歩行で別々に持たない。
  #
  # pitch の符号（2026-08-28 に IK と FK で確認した実測値）:
  #   pitch -10 -> つま先が 10.4mm 上がる -> 脛が前へ倒れる -> **胴体は前へ**
  #   pitch +10 -> つま先が 10.4mm 下がる -> 脛が後ろへ     -> 胴体は後ろへ
  #
  # ★いまは -8（2026-08-29）。実機が約 10 deg 後傾していたので、そのぶん胴体を前へ
  #   戻すバッファ。**10 は入れられない**ので 8 で止めてある（下の走査）。
  #   x: -20 と併せて後傾の対症療法で、本来は膝リンクの剛性で消すべきずれ。
  #
  # 一度 pitch -10 を入れたが、height 261 と組み合わせると **歩けなくなる**。
  # 遊脚が後ろ 40mm・上 20mm に来る隅で θ5 が -55 deg に達し、足首パラレルリンクの
  # ロッドが届かなくなる（2026-08-28 実機で AnkleUnreachable が 4 回発生。
  # 起動時の到達域チェックも ERROR で予告していた）。高さ×ピッチの走査:
  #
  #     高さ\pitch      0      -5      -8     -10     -15   (3=design 2=mech 1=届かない)
  #        261          2       2       2       1       1
  #        266          2       2       2       2       1
  #        271          2       2       2       2       1
  #        281          2       2       2       2       2
  #
  # つまり height 261 で入れられるバッファは **-8 まで**（-10 で届かなくなる）。
  # それ以上要るなら height と gait.yaml の z_c を揃えて上げる。
  # しなり自体は膝の P ゲインを 32 -> 128 に上げて減らす方向で対処している。
  #
  # 走査のやり方（実機不要・バスを開かない）:
  #   ros2 run roboone_motion motion_node --ros-args -p dry_run:=true \
  #     -p allow_torque:=false -p home_pose_yaml:=<yaml> -p gait_yaml:=<yaml>
  #   起動ログの「歩行の足先の箱」の行が到達域の判定。
  # ※到達域チェックが見る高さは **gait.yaml の z_c** であって home_pose の height
  #   ではない。高さを振るときは両方を揃えて振らないと、この表は動かない。
  # ※2026-08-29 の再走査では 281 行が 3(design) ではなく 2(mech) になった。z_c だけ
  #   変えて step_clamp_* / swing_height を 261 用のまま使ったため。高さを本当に
  #   変えるなら gait_from_kinematics で gait.yaml を出し直すこと。
  rpy: [0.0, 0.0, 0.0]

# ---------------------------------------------------------------------------
# 腕（ID7-10）。運動学を持たないので、T ポーズ（servo_home.yaml の原点）を 0 とした
# サーボ角をそのまま書く。脚の FK・z_c には効かない。
#
# 数字はサーボ ID をキーにすると左右共通、"R8" / "L8" のように書くと片側だけ。
# 実機のサーボが逆に回る軸は roboone_motion の arm_invert が反転させるので、
# ここは「左右で同じ動きをさせたい値」を書けばよい。
# ---------------------------------------------------------------------------
# 軸の並びは T ポーズ基準で ID8 = 根元のピッチ / ID9 = 根元のロール /
# ID10 = そこから少し先のヨー。ID7 は右半身にしか無く、ここでは触らない（0 = T ポーズ）。
arms:
  8:  20.0     # 根元ピッチ。腕を前へ振り出す（+ が前）
  9:  70.0     # 根元ロール。T ポーズの水平から下ろす（2026-08-28 に 50 -> 70 へ）
  10: 30.0     # 先のヨー（肘相当）。少し前に曲げる
