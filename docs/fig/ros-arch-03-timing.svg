<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP',sans-serif">
  <rect width="1000" height="545" fill="#ffffff"/>
  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b23b3b"/>
    </marker>
    <pattern id="hatch" width="5" height="5" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#c9a45a" stroke-width="1.2"/>
    </pattern>
  </defs>

  <text x="24" y="30" font-size="17" font-weight="bold" fill="#2a2521">図3: 周期の設計 — 脳はゆっくり、脊髄は速く</text>
  <text x="24" y="50" font-size="12" fill="#6b6b6b">横軸は実時間0〜100ms（実比率・8px/ms）。上3段はトピック越し、下2段はmotionノードの中。</text>

  <!-- time axis -->
  <line x1="170" y1="86" x2="970" y2="86" stroke="#2a2521" stroke-width="1"/>
  <line x1="170" y1="82" x2="170" y2="90" stroke="#2a2521" stroke-width="1"/>
  <line x1="330" y1="82" x2="330" y2="90" stroke="#2a2521" stroke-width="1"/>
  <line x1="490" y1="82" x2="490" y2="90" stroke="#2a2521" stroke-width="1"/>
  <line x1="650" y1="82" x2="650" y2="90" stroke="#2a2521" stroke-width="1"/>
  <line x1="810" y1="82" x2="810" y2="90" stroke="#2a2521" stroke-width="1"/>
  <line x1="970" y1="82" x2="970" y2="90" stroke="#2a2521" stroke-width="1"/>
  <text x="170" y="76" font-size="10" fill="#2a2521" text-anchor="middle">0</text>
  <text x="330" y="76" font-size="10" fill="#2a2521" text-anchor="middle">20</text>
  <text x="490" y="76" font-size="10" fill="#2a2521" text-anchor="middle">40</text>
  <text x="650" y="76" font-size="10" fill="#2a2521" text-anchor="middle">60</text>
  <text x="810" y="76" font-size="10" fill="#2a2521" text-anchor="middle">80</text>
  <text x="970" y="76" font-size="10" fill="#2a2521" text-anchor="middle">100ms</text>

  <!-- row1: camera frames 30Hz -->
  <text x="160" y="117" font-size="10.5" font-family="Consolas,monospace" fill="#2a2521" text-anchor="end">/camera/…/points</text>
  <text x="160" y="131" font-size="10" fill="#b23b3b" text-anchor="end">30Hz（33msごと）</text>
  <line x1="170" y1="112" x2="170" y2="128" stroke="#3a6b64" stroke-width="2.5"/>
  <line x1="436" y1="112" x2="436" y2="128" stroke="#3a6b64" stroke-width="2.5"/>
  <line x1="703" y1="112" x2="703" y2="128" stroke="#3a6b64" stroke-width="2.5"/>
  <line x1="970" y1="112" x2="970" y2="128" stroke="#3a6b64" stroke-width="2.5"/>

  <!-- row2: detection processing -->
  <text x="160" y="167" font-size="10.5" font-family="Consolas,monospace" fill="#2a2521" text-anchor="end">opponent_detector</text>
  <text x="160" y="181" font-size="10" fill="#b23b3b" text-anchor="end">検知 約15Hz</text>
  <line x1="170" y1="128" x2="170" y2="162" stroke="#9aa7a4" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="170" y="162" width="200" height="16" fill="url(#hatch)" stroke="#c9a45a" stroke-width="1"/>
  <text x="270" y="156" font-size="9.5" fill="#555555" text-anchor="middle">検知処理 ~25ms※</text>
  <line x1="370" y1="160" x2="370" y2="180" stroke="#3a6b64" stroke-width="2.5"/>
  <text x="380" y="172" font-size="9.5" fill="#3a6b64">→ /opponent 配信</text>
  <line x1="703" y1="128" x2="703" y2="162" stroke="#9aa7a4" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="703" y="162" width="200" height="16" fill="url(#hatch)" stroke="#c9a45a" stroke-width="1"/>
  <line x1="903" y1="160" x2="903" y2="180" stroke="#3a6b64" stroke-width="2.5"/>

  <!-- row3: behavior 20Hz -->
  <text x="160" y="227" font-size="10.5" font-family="Consolas,monospace" fill="#2a2521" text-anchor="end">/cmd_walk</text>
  <text x="160" y="241" font-size="10" fill="#b23b3b" text-anchor="end">20Hz（50msごと）</text>
  <line x1="370" y1="182" x2="646" y2="222" stroke="#9aa7a4" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="250" y1="222" x2="250" y2="238" stroke="#3a6b64" stroke-width="2.5"/>
  <line x1="650" y1="222" x2="650" y2="238" stroke="#3a6b64" stroke-width="2.5"/>

  <!-- latency annotation -->
  <line x1="170" y1="258" x2="650" y2="258" stroke="#b23b3b" stroke-width="1.2" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="410" y="274" font-size="11" fill="#b23b3b" text-anchor="middle">相手を見てから歩行指令に反映されるまで（この例では60ms）— この経路は遅れて良い</text>

  <!-- boundary -->
  <line x1="30" y1="292" x2="970" y2="292" stroke="#b23b3b" stroke-width="1.3" stroke-dasharray="8 5"/>
  <text x="965" y="286" font-size="10.5" fill="#b23b3b" text-anchor="end">ここから上: トピック越し（プロセス間・遅れを許す設計）</text>
  <text x="965" y="308" font-size="10.5" fill="#b23b3b" text-anchor="end">ここから下: motionノードの中（周期厳守・トピックを通らない）</text>

  <!-- row4: 200Hz loop -->
  <text x="160" y="337" font-size="10.5" fill="#2a2521" text-anchor="end">motion 制御ループ</text>
  <text x="160" y="351" font-size="10" fill="#b23b3b" text-anchor="end">200Hz（5msごと）</text>
  <line x1="170" y1="332" x2="170" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="210" y1="332" x2="210" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="250" y1="332" x2="250" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="290" y1="332" x2="290" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="330" y1="332" x2="330" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="370" y1="332" x2="370" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="410" y1="332" x2="410" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="450" y1="332" x2="450" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="490" y1="332" x2="490" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="530" y1="332" x2="530" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="570" y1="332" x2="570" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="610" y1="332" x2="610" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="650" y1="332" x2="650" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="690" y1="332" x2="690" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="730" y1="332" x2="730" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="770" y1="332" x2="770" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="810" y1="332" x2="810" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="850" y1="332" x2="850" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="890" y1="332" x2="890" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="930" y1="332" x2="930" y2="348" stroke="#2a2521" stroke-width="1.8"/>
  <line x1="970" y1="332" x2="970" y2="348" stroke="#2a2521" stroke-width="1.8"/>

  <!-- row5: serial writes -->
  <text x="160" y="387" font-size="10.5" fill="#2a2521" text-anchor="end">サーボ一斉送信</text>
  <text x="160" y="401" font-size="10" fill="#b23b3b" text-anchor="end">~1.5ms/回※</text>
  <rect x="172" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="212" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="252" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="292" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="332" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="372" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="412" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="452" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="492" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="532" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="572" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="612" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="652" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="692" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="732" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="772" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="812" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="852" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="892" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <rect x="932" y="382" width="12" height="14" fill="#dfe8e6" stroke="#2a2521" stroke-width="0.8"/>
  <text x="172" y="428" font-size="11" fill="#3a6b64">IMUによる転倒防止の補正は5msごとに効く。この速さはトピック越しでは保証できない</text>

  <!-- bottom notes -->
  <text x="40" y="470" font-size="11" fill="#2a2521">・周期は初期の目安。※印（検知処理時間・18軸ぶんのシリアル送信時間）は実測して調整する</text>
  <text x="40" y="490" font-size="11" fill="#2a2521">・トピック越しの経路は多少遅れても勝敗に響きにくいように設計し、転倒に関わる補正だけを速いループに置く</text>
  <text x="40" y="510" font-size="11" fill="#2a2521">・「ノードは細かく分けるほど良い」わけではない理由がこれ。速さが要る所は1ノードに束ねる（ros2_controlと同じ発想）</text>
</svg>
